# Place this file at ~/.claude/cc_web.conf
# Single source of config for claude-code-web. Comments start with #.
# Re-read on each request for `cwd` / LLM keys; `token` is read once at startup.

# --- auth ---
# Required in `Authorization: Bearer <token>` header on every request.
# Pick something unguessable.
#
# If this line is MISSING (file absent, key misspelled, commented out) the server
# generates a RANDOM token at startup and only prints it in its log. The web UI
# then rejects every token you type and bounces you straight back to the login
# page — with no on-screen clue why — and the random one changes on every
# restart, so even copying it out of the log doesn't stick. The login page now
# says so explicitly when it happens, but the fix is always: set it here.
token=YOUR_SECRET_TOKEN_HERE

# --- LLM (OpenAI-compatible chat completions endpoint) ---
# Used by /api/attach to choose which iTerm2 tab matches the session, AND by
# /api/polish to clean up voice-input dictation into a tidy message.
# Leave api_base empty to disable both (attach falls back to heuristic-only;
# voice input still records + transcribes but skips the polish step).
api_base=
api_key=YOUR_API_KEY_HERE
model=claude-haiku-4-5

# --- "New session" allowlist (one `cwd=` line per directory) ---
# The "New session" dialog only lets you spawn `claude` in these dirs.
cwd=/Users/you/Desktop/project-a
cwd=/Users/you/Desktop/project-b

# --- Voice input, BATCH path (one `asr=` line per model; first = default) ---
# The 🎤 button records mic audio and POSTs the whole clip to an OpenAI-style
# transcription endpoint (POST /v1/audio/transcriptions — e.g. a litellm proxy),
# then the text comes back all at once. Format:
#   asr=<label>|<api_base>|<key>|<model>
# Multiple lines are switchable from the ⚙ dropdown's "语音输入 Voice" section
# (the first line is the default). Omit entirely to hide the mic button.
# NOTE: the browser needs HTTPS (secure context) for getUserMedia to record.
asr=LABEL_A|https://your-asr-host.example/|YOUR_API_KEY_HERE|MODEL_NAME_A
asr=LABEL_B|https://your-asr-host.example/|YOUR_API_KEY_HERE|MODEL_NAME_B

# --- Voice input, REALTIME (streaming) path — optional, separate from `asr=` ---
# These stream audio over a WebSocket so words appear while you are still
# talking, instead of waiting for the whole clip. Configure either or both and
# the ⚙ menu grows a ⚡realtime / 🎤batch switch plus one entry per engine; with
# NEITHER of them and no `asr=` line, that section shows "not configured yet"
# and the 🎤 button stays hidden. The WS URL lives here rather than in the code
# so you can point it at your own proxy.
#   openai_realtime=<ws_base_url>|<key>|<display name?>
#   soniox=<ws_url>|<key>|<display name?>
openai_realtime=wss://your-openai-proxy.example/v1/realtime|YOUR_API_KEY_HERE|OpenAI
soniox=wss://your-soniox-host.example/transcribe-websocket|YOUR_API_KEY_HERE|Soniox

# --- Session-list snapshots (optional) ---
# The tabs popup can save every live claude tab (session-id + cwd + tab name + order) so
# they can be reopened with `claude --resume` after a crash or reboot. Two stores:
#   manual  ~/.claude/cc_web_session_snapshot.json   written only by the 💾 Save button
#   auto    ~/.claude/cc_web_snapshots/              written on a timer (default 30 min),
#                                                    one entry per session-SET, newest
#                                                    100 kept
# Resume lets you pick which one (the manual list, or any point in the auto history).
# The timer skips saving whenever it can't see a trustworthy picture — terminal
# unreachable, zero tabs, or a resume in progress — so it can never replace a good
# record with an empty one. If the same sessions are still open, the entry is replaced
# (write first, then delete) rather than piling up a near-duplicate every period — only a
# CHANGED set of session-ids earns a new history entry. Set to 0 to turn the timer off.
#snapshot_every_min=30

# --- Per-machine browser-tab icon (optional) ---
# With several cc-web tabs open (one per machine) they all looked identical. Set this
# and this host serves a labelled, coloured favicon instead of the plain C:
#   pro   Pr, orange     air   Air, cyan
#   linux Lx, green      win   Wn, violet
#   tp    Tp, green      az    Az, blue
# Omit the line for the default C. Re-read per request, so no restart is needed.
# The phone home-screen icon (apple-touch-icon) stays generic either way.
#icon=pro

# --- What to call this machine (optional) ---
# A few letters. Two uses, one fact:
#   * the browser-tab title becomes "<name> - <agent>" ("x13 - claude",
#     "azure - codex"). Without it the title is the product name, which is
#     identical on every instance — with four tabs open, nothing tells them
#     apart but a 16px favicon, and on a greyscale e-ink screen not even that.
#   * the ask-peer skill puts it in the relay tag when a session has no name
#     of its own.
# Keep it SHORT: a browser tab truncates from the end and a narrow one shows
# about ten characters. Re-read per request, like icon=.
#name=my-mac

# --- The whip (the watchdog that nudges a stalled session) ---
# It only ever looks at a session you REGISTERED for it (⚙ → Watch: write a policy and
# turn it on). These numbers are read every pass, so changing them needs no restart.
#   whip_quiet_seconds     only act after this much silence (default 600). The rule is
#                          "do not collide with me" — ten minutes of nothing means the
#                          conversation is not live.
#   whip_max_nudges        per task version (default 3). Three unanswered nudges is not
#                          a stuck session, it is a wrong nudge: stop and escalate.
#   whip_backoff_seconds   same situation, 2nd/3rd/later look (default 600,1800,7200).
#   whip_interval_seconds  the loop (default 180), shared with the API-error nudge.
#   whip_triage_model      cheap model: decides IF anything is needed. Most passes end
#                          here, which is why it is separate from the next one.
#   whip_decide_model      stronger model: decides WHAT — and may only return
#                          nudge / escalate / nothing. There is no "approve".
# Both use api_base/api_key above. Unset → the summary model is used for both.
#whip_quiet_seconds=600
#whip_max_nudges=3
#whip_backoff_seconds=600,1800,7200
#whip_interval_seconds=180
#whip_triage_model=claude-haiku-4-5
#whip_decide_model=claude-sonnet-4-6

# --- Read by the bundled skills, IGNORED by the server ---
# The ask-peer / session-name skills share this file, so their keys live here
# too. cc_web.py's parser simply skips anything it doesn't know.
#   hosts= comma-separated cc-web hosts to auto-search when messaging a peer
#          session whose machine you didn't specify (local host is always tried
#          first). Without it, only the local host is searched.
#hosts=100.x.x.x,100.y.y.y
