# Place this file at ~/.claude/cc_web.conf
# Single source of config for claude-code-web. Comments start with #.
# Re-read on each request for `cwd` / LLM keys; `token` is read once at startup.

# --- auth ---
# Required in `Authorization: Bearer <token>` header on every request.
# Pick something unguessable. If missing, the server prints an ephemeral one.
token=YOUR_SECRET_TOKEN_HERE

# --- LLM picker (OpenAI-compatible chat completions endpoint) ---
# Used by /api/attach to choose which iTerm2 tab matches the session.
# Leave api_base empty to disable LLM tie-break (heuristic-only).
api_base=
api_key=YOUR_API_KEY_HERE
model=claude-haiku-4-5

# --- "New session" allowlist (one `cwd=` line per directory) ---
# The "New session" dialog only lets you spawn `claude` in these dirs.
cwd=/Users/you/Desktop/project-a
cwd=/Users/you/Desktop/project-b
