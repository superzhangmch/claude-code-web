# Place this file at ~/.claude/cc_web.conf
# Single source of config for claude-code-web. Comments start with #.
# Re-read on each request for `cwd` / LLM keys; `token` is read once at startup.

# --- auth ---
# Required in `Authorization: Bearer <token>` header on every request.
# Pick something unguessable. If missing, the server prints an ephemeral one.
token=YOUR_SECRET_TOKEN_HERE

# --- LLM (OpenAI-compatible chat completions endpoint) ---
# Used by /api/attach to choose which iTerm2 tab matches the session, AND by
# /api/polish to clean up voice-input dictation into a tidy message.
# Leave api_base empty to disable both (attach falls back to heuristic-only;
# voice input still records + transcribes but skips the polish step).
api_base=
api_key=YOUR_API_KEY_HERE
model=claude-haiku-4-5

# --- "New session" allowlist (one `cwd=` line per directory) ---
# The "New session" dialog only lets you spawn `claude` in these dirs.
cwd=/Users/you/Desktop/project-a
cwd=/Users/you/Desktop/project-b

# --- Voice input ASR backends (one `asr=` line per model; first = default) ---
# The 🎤 button records mic audio and POSTs it to an OpenAI-style transcription
# endpoint (POST /v1/audio/transcriptions — e.g. a litellm proxy). Format:
#   asr=<label>|<api_base>|<key>|<model>
# Multiple lines are switchable from the ▁ dropdown's "语音识别 ASR" section
# (the first line is the default). Omit entirely to hide the mic button.
# NOTE: the browser needs HTTPS (secure context) for getUserMedia to record.
asr=LABEL_A|https://your-asr-host.example/|YOUR_API_KEY_HERE|MODEL_NAME_A
asr=LABEL_B|https://your-asr-host.example/|YOUR_API_KEY_HERE|MODEL_NAME_B
