<!doctype html>
<!--
  Desktop counterpart of /remote/. Mouse-centric, same backend.

  Gestures on the screenshot:
    plain click (left)  → /api/click  left
    double click (left) → /api/click  left double=true
    right click         → /api/click  right
    drag (mousedown→up,
          travel > 6 px) → /api/drag

  Single vs double click is resolved by a 220 ms delay (browser dblclick
  cancels a pending single). Drag vs click uses a 6 px threshold.

  After-click add-ons (radio in the header):
    zoom    → fetch /api/cursor_strip and overlay the source area exactly,
              pixel-aligned with the underlying screenshot
    type    → enter type-mode (input box + crop overlay) at the click;
              Send/Live toggle mirrors /remote/'s liveText behavior
    capkeys → while the cursor is over the screenshot, every key (and
              modifier combo) is forwarded to Mac; ENTER/ESC trigger a
              screenshot reload

  All API calls reuse /remote/api/* — no new backend endpoints.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>remote_pc — desktop remote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0e0f12;
      --panel: #161821;
      --panel2: #1d2030;
      --border: #2a2d36;
      --fg: #d7d9e0;
      --dim: #8a8f9c;
      --accent: #4a9eff;
      --warn: #ffb05a;
      --err: #ff6a6a;
      --ok: #6ee884;
      /* The page's big surfaces used to be #000 / #0a0b0e / #1a1a1a straight in the
         rule. Adding a light theme therefore changed almost nothing you could see —
         header, the screenshot stage, the key bar and the footer all stayed black. They
         read these now, so all three modes actually reach them. */
      --chrome: #000;      /* header / footer / key bar */
      --stage: #000;       /* what the screenshot sits on */
      --guide: #ff8a8a;    /* the drag guide line */
    }
    /* Follow cc-web's display mode. Same key and same class names as the session page
       and the phone remote (cc_web_theme: light | pure), so the three agree without any
       control of their own — this page had no light mode at all and stayed dark when
       everything else went light. Only the variables are overridden: every rule below
       reads them. */
    body.light {
      --bg: #fdf6e3; --panel: #f5edd6; --panel2: #ece3c8; --border: #d8cdb0;
      --fg: #1d2021; --dim: #7c6f64; --accent: #af3a03;
      --warn: #b57614; --err: #9d0006; --ok: #2f6b2e;
      --chrome: #f5edd6; --stage: #efe6cd; --guide: #9d0006;
    }
    body.pure {
      --bg: #fff; --panel: #fff; --panel2: #f2f2f2; --border: #000;
      --fg: #000; --dim: #333; --accent: #000;
      --warn: #000; --err: #000; --ok: #000;
      --chrome: #fff; --stage: #fff; --guide: #000;
    }
    /* pure is a black-and-white mode for e-ink: colour carries nothing, so the accent
       fill that marks the primary button has to become a border instead or it turns
       into a black block with black text. */
    body.pure header button.primary { background: #fff !important; color: #000 !important; }
    body.pure header button, body.pure header select { border-color: #000 !important; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--fg);
      font: 14px/1.4 -apple-system, system-ui, sans-serif;
      height: 100%;
    }
    body { display: flex; flex-direction: column; }
    /* Width of the key column: the groups are 147px (2×72 + gap) plus #keybar's 4px
       padding either side and its border. Kept as tight as the labels allow — every px
       here is a px the screenshot does not get. Everything else in that column — the
       status line, the traffic readout — wraps inside it rather than widening it. */
    :root { --keycol: 156px; }

    header {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: var(--chrome);
      border-bottom: 1px solid var(--border);
    }
    /* Every control in the header is the same box: one height, one radius, one border,
       one font. They were each their own shape before — the back link 4/9 padding at 75%
       opacity, the buttons 5/12, the selects whatever the browser felt like — which in a
       single row reads as three unrelated toolbars. Only the FILL marks the primary
       action now. */
    header button, header a.backlink, header select {
      box-sizing: border-box; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--panel2); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0 10px; font: inherit; line-height: 1;
      white-space: nowrap; cursor: pointer;
    }
    header select { padding: 0 4px; }
    header button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    header button:hover, header a.backlink:hover, header select:hover { border-color: var(--accent); }
    header label { color: var(--dim); }
    header label input[type="radio"] { margin: 0 4px 0 8px; }
    header .gap { margin-left: auto; }
    header .hint { color: var(--dim); font-size: 12px; }
    /* Back to cc-web. A real link, and in the header where it costs no vertical space.
       Shape comes from the shared rule above; all it needs is to stop looking like a
       link. */
    header a.backlink { text-decoration: none; }
    /* Visual grouping in the header: thin border around each cluster. */
    header .grp {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
    }
    /* Two characters are not worth wrapping: 内屏 broke into 内 / 屏 on two lines, which
       makes the header taller than the shot can spare and reads as four labels. */
    header .grp label { white-space: nowrap; }

    /* keybar + stage + status. In a wide, short window the keys and the status line were
       stealing the one thing the screenshot needs — height — while the space beside the
       image sat empty. In `side` mode they move into a column there instead.
       A grid, not flex: side mode needs the keys AND the status stacked in the left
       column with the stage spanning both rows, which no single flex direction gives.
       Which mode is right depends on the window's aspect against the SHOT's aspect, so
       the switch lives in applyFit rather than in a media query — a 16:10 mac on a 21:9
       monitor needs it; the same monitor showing a portrait screenshot does not. */
    #stagewrap {
      flex: 1 1 auto; min-height: 0; min-width: 0;
      display: grid; grid-template-areas: "keys" "stage" "status";
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    #keybar { grid-area: keys; }
    #stagewrap > main { grid-area: stage; }
    #stagewrap > footer { grid-area: status; }
    /* Column on the RIGHT, image on the left — the two halves of the same decision:
       the shot is left-aligned, so the leftover space is one block on the right and the
       controls belong in it. */
    body.side #stagewrap {
      grid-template-areas: "stage keys" "stage status";
      /* A FIXED key column, not max-content. max-content asked the whole column what it
         wanted, and the widest thing in it is the status line — "1470×956 pt · … · 145
         KB" made the column 451px in a 1440px window while the keys themselves are
         155px. 250px of empty column, and the shot lost that width for nothing: fitted
         to the height it no longer fit across, so it turned into something you had to
         scroll. The keys are 147px of groups + the bar's own padding. */
      grid-template-columns: minmax(0, 1fr) var(--keycol);
      grid-template-rows: minmax(0, 1fr) auto;
    }
    body.side #keybar {
      /* nowrap: the groups are compact enough to fit one column, and wrapping split the
         strip at whatever height the window happened to have — the traffic readout ended
         up at the TOP of a second column, detached from everything. If it does not fit,
         it scrolls (overflow: auto below), which keeps the order intact. */
      flex-direction: column; flex-wrap: nowrap; align-content: flex-start;
      min-width: 0; min-height: 0; overflow: auto; padding: 6px 4px;
      border-top: 0; border-left: 1px solid var(--border);
    }
    body.side #keybar .sep { width: 100%; height: 1px; align-self: stretch; margin: 3px 0; }
    /* the status group, stacked under the keys instead of across the bottom */
    body.side #stagewrap > footer {
      flex-direction: column; align-items: flex-start; gap: 2px;
      min-width: 0; overflow-wrap: anywhere;
      border-top: 1px solid var(--border); border-left: 1px solid var(--border);
    }
    body.side #stagewrap > footer .gap { display: none; }
    /* A PHONE opening the desktop page. The shape is still right — header row on top,
       shot on the left fitted to the HEIGHT, keys in a column on the right — it just does
       not fit across, so the page scrolls sideways instead of rearranging itself into
       something else. Both columns size to their content and #stagewrap is the scroller;
       34vw caps would squeeze the key column to ~130px here, so they are lifted. */
    body.narrow #stagewrap {
      /* Keys FIRST on a phone — the opposite side from the desktop, on purpose. With the
         column on the right there was nothing at scroll 0 to tell you a keyboard
         existed: you had to think of panning sideways to find it. The shot is what runs
         off to the right instead (panned inside the stage), and a screenshot with its
         left edge showing is obviously a thing you can drag. */
      grid-template-areas: "keys stage" "status stage";
      grid-template-columns: var(--keycol) minmax(0, 1fr);
    }
    body.narrow #keybar,
    body.narrow #stagewrap > footer {
      border-left: 0; border-right: 1px solid var(--border);
    }
    /* Collapsed: the whole left column goes and the stage takes the width. Phone only —
       the button is display:none elsewhere, so the class cannot be reached there. */
    #keysToggle { display: none; }
    body.narrow #keysToggle { display: inline-flex; }
    body.narrow.keys-off #stagewrap {
      grid-template-areas: "stage" "stage";
      grid-template-columns: minmax(0, 1fr);
    }
    body.narrow.keys-off #keybar,
    body.narrow.keys-off #stagewrap > footer { display: none; }
    /* The header scrolls sideways too, for the same reason: wrapped onto four lines it
       takes the height the screenshot needs. */
    body.narrow header {
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
    }
    body.narrow header .gap { display: none; }      /* nothing to push apart in one line */
    main {
      flex: 1 1 auto;
      overflow: auto;
      position: relative;
      background: var(--stage);
      min-width: 0; min-height: 0;
    }
    #screen-wrap {
      position: relative;
      display: inline-block;            /* shrink-wrap the image; main scrolls if larger */
      user-select: none;
    }
    #screen-wrap img.screen {
      display: block;
      max-width: none;                  /* render at natural pixel size */
      pointer-events: none;             /* let our overlay receive events */
    }
    /* FIT: fill the window instead of showing the shot at 1:1. On a desktop 1:1 is
       right — those are the mac's own pixels. On an iPad the shot is smaller than the
       viewport and sat in a black frame with most of the screen unused.
       The SIZE is computed in JS (applyFit) rather than left to object-fit, because the
       <img> box has to stay exactly the painted image: every click is converted through
       clientWidth/clientHeight, and with object-fit the box would include letterbox
       margins and clicks in them would map onto the screen anyway. */
    /* Left-aligned, not centred: with the image height-bound the leftover space is
       horizontal, and splitting it into two margins puts the thing you are working on in
       the middle of nowhere. All of it goes to the right instead. */
    /* overflow auto, not hidden: the shot is fitted to the HEIGHT now, so a window
       narrower than its aspect has more image than column — that gets panned here,
       inside the stage, which leaves the key column pinned where it is instead of
       scrolling it off the side of the page. */
    body.fit main { overflow: auto; display: flex; align-items: flex-start; justify-content: flex-start; }
    body.fit #screen-wrap { display: block; }
    /* Transparent capture layer covering the screenshot — catches all
       mouse events so the user can hover/click on the image normally. */
    #capture {
      position: absolute; inset: 0;
      /* A hand, not a crosshair: this surface is a thing you CLICK (the click lands on
         the mac at that spot), and a crosshair reads as "select a region" — which is
         only what the drag does, and the drag says so with `grabbing`. */
      cursor: pointer;
    }
    #capture.dragging { cursor: grabbing; }

    /* Drag-rubber-band line drawn on the screenshot during drag.
       Implemented as a thin 0-height div rotated to the angle from start
       to current point — its top-border is a dashed line. */
    #drag-line {
      position: absolute; pointer-events: none;
      height: 0;
      border-top: 2px dashed var(--guide);
      transform-origin: 0 50%;        /* rotate around the start endpoint */
      display: none;
    }
    .pulse {
      position: absolute; pointer-events: none;
      width: 24px; height: 24px;
      border: 2px solid var(--accent); border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      animation: pulse 0.5s ease-out;
    }
    @keyframes pulse {
      0%   { opacity: 1; width: 8px; height: 8px; }
      100% { opacity: 0; width: 60px; height: 60px; }
    }

    /* Floating cursor-strip popup for shift+click. Position-fixed so it
       lives in viewport coords — no wrapEl / scrollLeft math needed. */
    .zoom-popup {
      position: fixed; pointer-events: none;
      background: var(--panel); border: 1.5px solid var(--accent);
      border-radius: 6px; padding: 2px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      z-index: 50;
    }
    .zoom-popup img { display: block; }
    .zoom-popup .meta {
      font: 11px ui-monospace, monospace; color: var(--dim);
      text-align: center; margin-top: 2px;
    }

    /* Type-mode overlay: covers a region of the screenshot with a
       higher-res crop + input box on top. */
    .type-overlay {
      position: absolute;
      z-index: 100;
      border: 2px solid var(--accent);
      box-shadow: 0 4px 24px rgba(74,158,255,0.4);
      background: var(--stage);
    }
    .type-overlay img.crop {
      display: block;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    /* Bottom bar below the type-overlay: input + Send button + Live toggle. */
    .type-overlay .type-bar {
      position: absolute;
      left: -2px; right: -2px;
      top: 100%; margin-top: 4px;
      display: flex; gap: 6px; align-items: stretch;
    }
    .type-overlay .type-bar input.live {
      flex: 1;
      background: rgba(0,0,0,0.85); color: var(--fg);
      border: 1px solid var(--accent); border-radius: 4px;
      padding: 6px 8px; font: 14px ui-monospace, monospace;
      outline: none;
    }
    .type-overlay .type-bar button.send {
      background: var(--accent); color: white;
      border: 1px solid var(--accent); border-radius: 4px;
      padding: 4px 12px; cursor: pointer;
      font: inherit; font-weight: 600;
    }
    .type-overlay .type-bar label.live-toggle {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--dim); font-size: 12px;
      padding: 0 6px;
      border: 1px solid transparent; border-radius: 4px;
    }
    .type-overlay .type-bar label.live-toggle.on {
      color: var(--ok); border-color: var(--ok);
    }
    .type-overlay .close {
      position: absolute; top: -1px; right: -1px;
      background: var(--accent); color: white; border: none;
      width: 22px; height: 22px; border-radius: 0 0 0 6px;
      font: 14px sans-serif; cursor: pointer;
    }

    /* Unlock modal — only shown when the Unlock button is tapped. */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 200;
    }
    .modal-bg.show { display: flex; }
    .modal-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px;
      width: 360px; max-width: 90vw;
      color: var(--fg);
    }
    .modal-card h3 { margin: 0 0 6px; }
    .modal-card .hint { color: var(--dim); font-size: 12px; margin: 0 0 12px; line-height: 1.4; }
    .modal-card input[type="password"] {
      width: 100%; padding: 6px 8px;
      background: var(--panel2); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px;
      font: inherit;
    }
    .modal-card label.opt { display: block; margin-top: 6px; color: var(--dim); font-size: 13px; }
    .modal-card .row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
    .modal-card button {
      background: var(--panel2); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 14px; font: inherit; cursor: pointer;
    }
    .modal-card button.primary { background: var(--accent); border-color: var(--accent); color: white; }

    /* Special-keys bar — same set as /remote/'s nav-grid, laid out
       as a single wrapping row on desktop. */
    #keybar {
      flex: 0 0 auto;
      display: flex; flex-wrap: wrap; gap: 4px;
      padding: 6px 8px; background: var(--chrome);
      border-bottom: 1px solid var(--border);
    }
    #unlockForm { display: contents; }
    #unlockUser {
      width: 100%; box-sizing: border-box; margin-bottom: 6px;
      background: transparent; border: 0; padding: 0;
      color: var(--dim); font: inherit; font-size: 12px;
    }
    #unlockUser:focus { outline: none; }
    #keybar button {
      background: var(--panel2); color: var(--fg);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 4px 5px; min-height: 28px;
      font: 12px ui-monospace, monospace; cursor: pointer;
      white-space: nowrap;
    }
    #keybar button:hover  { border-color: var(--accent); }
    #keybar button:active { background: var(--card-hi); }
    #keybar .sep {
      display: inline-block; width: 1px; align-self: stretch;
      background: var(--border); margin: 2px 4px;
    }
    /* Keys grouped the way a keyboard groups them, instead of one flat list. In the side
       column that list was 24 identical buttons running straight down — nothing to aim
       at, and it ate the height the screenshot wants. Each family is its own small grid:
       the arrows in their inverted-T, PgUp/PgDn above ⤒/⤓ in a 2×2, and the rest in
       two columns. Grids, not more flex, because the ↑ has to sit above the ↓ in the
       MIDDLE column with nothing beside it — no flex direction gives that. */
    #keybar .kgrid { display: grid; gap: 3px; align-content: start; }
    /* Fixed columns, the same in every group: the groups then have one width, so the
       side column can WRAP them into two tidy columns when the window is short instead
       of running one long strip down the edge. 84px fits the longest label
       ("⌫ backSp") at 12px monospace plus its padding. */
    #keybar .kgrid.k2 { grid-template-columns: repeat(2, 72px); }
    /* 3 × 47 + two 3px gaps = 147px = 2 × 72 + one gap: the arrow cluster is exactly as
       wide as the pair groups, so every group shares one left and one right edge. Ragged
       edges were most of why the column still looked untidy. */
    #keybar .kgrid.nav { grid-template-columns: repeat(3, 47px); }
    /* An odd key out (⌨ type, Wake) takes the whole row instead of leaving a hole. */
    #keybar .kgrid .k-wide { grid-column: 1 / -1; }
    #keybar .kgrid.nav .k-pgup  { grid-area: 1 / 1; }
    #keybar .kgrid.nav .k-up    { grid-area: 1 / 2; }
    #keybar .kgrid.nav .k-pgdn  { grid-area: 1 / 3; }
    #keybar .kgrid.nav .k-left  { grid-area: 2 / 1; }
    #keybar .kgrid.nav .k-down  { grid-area: 2 / 2; }
    #keybar .kgrid.nav .k-right { grid-area: 2 / 3; }
    #keybar .kgrid.nav button { padding: 4px 0; text-align: center; }
    body.side #keybar .sep { margin: 3px 0; }
    /* Horizontal keybar: the groups sit side by side as blocks. Side column: they stack,
       and wrap into a second column of groups if the window is too short — which is why
       a group is never full-width there. */
    body.side #keybar .sep { max-width: 174px; }

    footer {
      flex: 0 0 auto;
      padding: 6px 12px; background: var(--chrome);
      border-top: 1px solid var(--border);
      font: 12px ui-monospace, monospace; color: var(--dim);
      display: flex; gap: 12px; align-items: center;
    }
    footer .status { color: var(--fg); }
    footer .ok  { color: var(--ok); }
    footer .err { color: var(--err); }
  </style>
</head>
<body>
<script>/* match cc-web theme (same-origin localStorage) — before paint, so there is no
  dark flash on a light device */(function(){try{var t=localStorage.getItem("cc_web_theme");
  if(t==="light"||t==="pure")document.body.classList.add(t);}catch(e){}})();</script>

<header>
  <a class="backlink" href="/" title="回 cc-web 的 session 列表">←</a>
  <!-- Phone only: the key column costs ~40% of a phone's width, and most of the time you
       are just looking at the mac. Collapsing it gives that width back to the shot. On a
       desktop there is nothing to reclaim, so the button is not rendered at all. -->
  <button id="keysToggle" title="收起/展开左边那列按键(手机上才有)">⌨ ◀</button>
  <button id="btn-load" class="primary js-load" title="Refresh screenshot">↻ Load</button>
  <!-- WHICH of the mac's screens. "main / external" was the API's vocabulary, not a
       description of anything: it says nothing about what you are choosing between. -->
  <!-- No label: 内屏/外屏 already say what the choice is, so "屏幕:" was three
       characters that added nothing. Header width is the scarce thing on this page. -->
  <div class="grp" id="dispGrp" title="截哪块屏幕(点击也落在这块屏上)。内屏 = mac 自己的主屏;外屏 = 插着的第二块显示器">
    <label><input type="radio" name="disp" value="main" checked> 内屏</label>
    <label id="dispExtLab"><input type="radio" name="disp" value="external"> 外屏</label>
  </div>
  <div class="grp">
    <label>Quality:
      <select id="qualitySel">
        <option value="30">low (30)</option>
        <option value="50" selected>med (50)</option>
        <option value="75">high (75)</option>
      </select>
    </label>
    <label>Resolution:
      <select id="maxdimSel">
        <option value="960">960px</option>
        <option value="1280">1280px</option>
        <option value="1600">1600px</option>
        <option value="2560">2560px</option>
      </select>
    </label>
    <label title="把截图缩放到填满窗口(iPad/小窗口用);关掉则按 mac 自己的像素 1:1 显示">
      <input type="checkbox" id="fitChk" checked> fit
    </label>
    <label>Auto:
      <select id="autoSel">
        <option value="0" selected>off</option>
        <option value="3">3s</option>
        <option value="5">5s</option>
        <option value="10">10s</option>
      </select>
    </label>
  </div>
  <div class="grp">
    <label><input type="radio" name="actionMode" value="off" checked> off</label>
    <label><input type="radio" name="actionMode" value="zoom"> 🔍 zoom after click</label>
    <label><input type="radio" name="actionMode" value="type"> ⌨ type after click</label>
    <label><input type="radio" name="actionMode" value="capkeys"> ⌨ capture keys on hover</label>
  </div>
  <span class="gap"></span>
</header>

<div id="stagewrap">
<div id="keybar">
  <!-- Typing lives in ONE place: the type overlay (input + Send/Live + a sharp crop of
       where the words are going). It used to be reachable only by clicking the
       screenshot with the `type` mode selected — which is why it did not look like "a
       place to type" at all, and why a second input box briefly got built here beside
       it. This button opens that same overlay without the click. -->
  <!-- Load is here as well as in the header: with the keys in a column beside the shot,
       this is where your hand already is, and refreshing is the thing you do most. Same
       handler as the header's (.js-load), never a second copy of it. -->
  <div class="kgrid k2">
    <button class="js-load" title="重新截图">↻ Load</button>
    <button id="typeHere" title="打字: 打开输入浮层(和「⌨ type after click」是同一个东西,只是不用先点截图)">⌨ type</button>
  </div>
  <span class="sep"></span>
  <!-- editing / movement (mac action) -->
  <div class="kgrid k2">
    <button onclick="sendKeyPC('Return',     {reload:true})">⏎ Return</button>
    <button onclick="sendKeyPC('Escape',     {reload:true})">Esc</button>
    <button onclick="sendKeyPC('Backspace')">⌫ backSp</button>
    <button onclick="sendKeyPC('Tab')">⇥ Tab</button>
  </div>
  <span class="sep"></span>
  <!-- The arrows in their inverted-T, with paging in the two cells beside ↑ — where a
       compact keyboard puts them (fn+↑ / fn+↓ on this very mac), and the holes in the
       top row were the only gaps left in the strip:
            PgUp  ↑  PgDn
              ←   ↓   →                                                            -->
  <div class="kgrid nav">
    <button class="k-pgup"  onclick="sendScrollPC(0,  400)">PgUp</button>
    <button class="k-up"    onclick="sendKeyPC('Up',    {reload:true})">↑</button>
    <button class="k-pgdn"  onclick="sendScrollPC(0, -400)">PgDn</button>
    <button class="k-left"  onclick="sendKeyPC('Left')">←</button>
    <button class="k-down"  onclick="sendKeyPC('Down',  {reload:true})">↓</button>
    <button class="k-right" onclick="sendKeyPC('Right')">→</button>
  </div>
  <!-- Directly under the arrows, because it is the same family: home/end used to sit
       among the delete keys, three groups away, because they are sent as Ctrl+A /
       Ctrl+E — that is how they work, not what they are for. -->
  <div class="kgrid k2">
    <button onclick="sendKeyPC('ctrl+a')" title="Ctrl+A — line start">⌃A home</button>
    <button onclick="sendKeyPC('ctrl+e')" title="Ctrl+E — line end">⌃E end</button>
    <button onclick="sendKeyPC('cmd+Up',   {reload:true})" title="Cmd+Up — scroll to top">⤒ top</button>
    <button onclick="sendKeyPC('cmd+Down', {reload:true})" title="Cmd+Down — scroll to bottom">⤓ bot</button>
  </div>
  <span class="sep"></span>
  <!-- what is left really is one family: delete things, and the clipboard -->
  <div class="kgrid k2">
    <button onclick="sendKeyPC('ctrl+w')" title="Ctrl+W — delete word backward">⌃W delW</button>
    <button onclick="sendKeyPC('ctrl+u')" title="Ctrl+U — delete to line start">⌃U delL</button>
    <button onclick="sendKeyPC('ctrl+c')" title="Ctrl+C — interrupt / SIGINT">⌃C int</button>
    <button onclick="sendKeyPC('ctrl+l', {reload:true})" title="Ctrl+L — clear screen">⌃L clr</button>
    <button onclick="sendKeyPC('cmd+c')" title="Cmd+C — copy">⌘C copy</button>
    <button onclick="sendKeyPC('cmd+v')" title="Cmd+V — paste">⌘V paste</button>

  <!-- system / window -->

    <button onclick="sendKeyPC('ctrl+cmd+q', {reload:true})" title="lock screen">Lock</button>
    <button onclick="openUnlockModal()" title="Wake + type password + Return">🔓 Unlock</button>
    <button onclick="runActionPC({label:'Dock', type:'show_dock'})">Dock</button>
    <!-- Mission Control / App Exposé: window management, which is what this group is —
         they were sitting with the scroll keys because they are Ctrl+arrows. -->
    <button onclick="sendKeyPC('ctrl+Up',   {reload:true})" title="Ctrl+Up — Mission Control (all windows)">all win</button>
    <button onclick="sendKeyPC('ctrl+Down', {reload:true})" title="Ctrl+Down — App windows (App Exposé)">app win</button>
    <button class="k-wide" onclick="runActionPC({label:'Wake', type:'wake', reload:false})">Wake</button>
  </div>
  <span class="sep"></span>
  <span id="traffic" style="font: 11px ui-monospace, monospace; color: var(--dim); align-self: center;" title="last screenshot · last crop image">📷 — · 🔍 —</span>
</div>

<main id="main">
  <div id="screen-wrap">
    <img id="screen" class="screen" alt="" />
    <div id="capture"></div>
    <div id="drag-line" class="drag-line"></div>
  </div>
</main>
<footer>
  <span class="status" id="status">ready — click Load to fetch screenshot</span>
  <span class="gap"></span>
  <span id="screen-meta"></span>
</footer>
</div>

</div>


<!-- Unlock modal. The password field used to be INJECTED on open, with the stated
     reason "so Chrome's password manager doesn't see a permanent type=password" — i.e.
     it was hiding from the manager on purpose. That policy is reversed: retyping a Mac
     login password on every unlock is the cost, and the manager (or the iOS keychain)
     is a better place for it than anywhere this app could put it. So: a real form, a
     username field to file it under, and current-password on the field. -->
<div class="modal-bg" id="unlockModal">
  <div class="modal-card">
    <h3>🔓 Wake &amp; Unlock Mac</h3>
    <p class="hint">Always locks the screen first (Ctrl+Cmd+Q) — no-op if already locked — so the password can never land in a focused app. Then wakes the display, types the password at HID level, presses Return.</p>
    <form id="unlockForm" autocomplete="on" onsubmit="return false">
      <input type="text" id="unlockUser" name="username" autocomplete="username"
             readonly tabindex="-1" aria-label="host" />
      <input type="password" id="unlockPwd" name="password" placeholder="Mac password"
             autocomplete="current-password" />
      <label class="opt"><input type="checkbox" id="unlockWake" checked> wake display first</label>
      <div class="row">
        <button type="button" onclick="closeUnlockModal()">Cancel</button>
        <button type="submit" class="primary" id="unlockSendBtn">Wake &amp; Send</button>
      </div>
    </form>
  </div>
</div>

<script>
// Shown inside cc-web's own full-screen overlay (an iframe), the ← would navigate THIS
// frame to the session list — a session list inside the control window, which reads as
// the app breaking. The overlay's ✕ is the way out there. `embed=1` is what the parent
// passes; the frame check is the belt to its braces.
const EMBEDDED = /[?&]embed=1/.test(location.search) || window.parent !== window;
if (EMBEDDED) {
  const back = document.querySelector('.backlink');
  if (back) back.style.display = 'none';
}
</script>
<script>
'use strict';

// ── token: same as /remote/ ───────────────────────────────────────────────
let token = localStorage.getItem('cc_web_token') || '';
if (!token) {
  token = prompt('cc_web token:') || '';
  if (token) localStorage.setItem('cc_web_token', token);
}
const authHeaders = () => (token ? { 'Authorization': 'Bearer ' + token } : {});

// ── DOM refs ───────────────────────────────────────────────────────────────
const mainEl     = document.getElementById('main');
const wrapEl     = document.getElementById('screen-wrap');
const screenImg  = document.getElementById('screen');
const captureEl  = document.getElementById('capture');
const statusEl   = document.getElementById('status');
const metaEl     = document.getElementById('screen-meta');
const btnLoad    = document.getElementById('btn-load');
const dragLineEl = document.getElementById('drag-line');

// Grey out 外接 when there is only one screen, and say so — rather than letting the
// backend's polite fallback look like a broken button.
function applyDisplayCount(count, isMain) {
  const lab = document.getElementById('dispExtLab');
  const ext = lab.querySelector('input');
  const only = count < 2;
  ext.disabled = only;
  lab.style.opacity = only ? '.45' : '';
  lab.title = only ? '没有外屏 — 这台 mac 现在只有一块屏'
                   : '插着的那块外接显示器';
  if (only && ext.checked) {              // picked before it was unplugged
    document.querySelector('input[name="disp"][value="main"]').checked = true;
  } else if (!only && ext.checked && isMain) {
    setStatus('外屏没截到,显示的是内屏', 'err');
  }
}

function currentDisplay() {
  const r = document.querySelector('input[name="disp"]:checked');
  return r ? r.value : 'main';
}
document.querySelectorAll('input[name="disp"]').forEach(el => {
  el.addEventListener('change', loadScreenshot);
});
document.getElementById('qualitySel').addEventListener('change', loadScreenshot);
document.getElementById('maxdimSel').addEventListener('change', loadScreenshot);

// ── Auto-reload: per N seconds, stop after AUTO_MAX ticks. The cap is
// there as a sanity guard against the user wandering off and leaving
// the page hammering /api/screenshot forever.
const autoSel = document.getElementById('autoSel');
const AUTO_MAX = 10;
let autoTimer = null, autoCount = 0;
function autoTick() {
  autoCount++;
  if (autoCount > AUTO_MAX) {
    clearInterval(autoTimer); autoTimer = null;
    autoSel.value = '0';
    setStatus(`auto-reload paused (hit ${AUTO_MAX}-tick cap, re-select to resume)`, 'err');
    return;
  }
  loadScreenshot();
}
function applyAuto() {
  clearInterval(autoTimer); autoTimer = null;
  autoCount = 0;
  const sec = parseInt(autoSel.value, 10);
  if (sec > 0) autoTimer = setInterval(autoTick, sec * 1000);
}
autoSel.addEventListener('change', applyAuto);

// Resolution default: min(1600, screen.width). Also append `screen.width`
// as an extra option so the user can pick "exactly my monitor" if the
// preset values don't match.
(function setupResolutionOptions() {
  const sel = document.getElementById('maxdimSel');
  const sw  = (window.screen && window.screen.width) || 1600;
  const existing = new Set(Array.from(sel.options).map(o => parseInt(o.value, 10)));
  if (!existing.has(sw)) {
    const opt = document.createElement('option');
    opt.value = String(sw);
    opt.textContent = sw + 'px (screen)';
    // Insert sorted by value.
    let inserted = false;
    for (const o of sel.options) {
      if (parseInt(o.value, 10) > sw) { sel.insertBefore(opt, o); inserted = true; break; }
    }
    if (!inserted) sel.appendChild(opt);
  }
  // Pick default = the largest existing value that is <= min(1600, screen.width).
  const cap = Math.min(1600, sw);
  const candidates = Array.from(sel.options)
    .map(o => parseInt(o.value, 10))
    .filter(v => v <= cap);
  const def = candidates.length ? Math.max(...candidates) : 960;
  sel.value = String(def);
})();

// ── status helpers ─────────────────────────────────────────────────────────
function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}
function pulseAt(x, y) {
  const p = document.createElement('div');
  p.className = 'pulse';
  p.style.left = x + 'px'; p.style.top = y + 'px';
  wrapEl.appendChild(p);
  setTimeout(() => p.remove(), 600);
}

// ── screen-W/H + display origin (read from /api/screenshot headers) ────────
let screenW = 0, screenH = 0, displayOriginX = 0, displayOriginY = 0;

// Last fetched image size (KB) — shown in the keybar's traffic readout.
let lastScreenKB = null, lastCropKB = null;
function updateTraffic() {
  const el = document.getElementById('traffic');
  if (!el) return;
  const s = lastScreenKB == null ? '—' : lastScreenKB + ' KB';
  const c = lastCropKB   == null ? '—' : lastCropKB   + ' KB';
  el.textContent = `📷 ${s} · 🔍 ${c}`;
}

async function loadScreenshot() {
  setStatus('loading…');
  try {
    const q = document.getElementById('qualitySel').value || 50;
    const w = document.getElementById('maxdimSel').value || 2560;
    const r = await fetch(`/remote/api/screenshot?w=${w}&q=${q}&display=${currentDisplay()}&_=${Date.now()}`,
                          { headers: authHeaders() });
    if (r.status === 401) { localStorage.removeItem('cc_web_token'); setStatus('unauthorized — reload', 'err'); return; }
    if (!r.ok) { setStatus('HTTP ' + r.status, 'err'); return; }
    // "external" falls back to main when nothing is plugged in, which from here looks
    // like the radio not working. The count says which it was, so the label can.
    applyDisplayCount(parseInt(r.headers.get('X-Display-Count') || '1', 10),
                      r.headers.get('X-Display-Is-Main') === '1');
    screenW = parseInt(r.headers.get('X-Screen-W') || '0', 10);
    screenH = parseInt(r.headers.get('X-Screen-H') || '0', 10);
    displayOriginX = parseInt(r.headers.get('X-Display-Origin-X') || '0', 10);
    displayOriginY = parseInt(r.headers.get('X-Display-Origin-Y') || '0', 10);
    const blob = await r.blob();
    if (screenImg._lastUrl) URL.revokeObjectURL(screenImg._lastUrl);
    screenImg._lastUrl = URL.createObjectURL(blob);
    screenImg.src = screenImg._lastUrl;
    await new Promise(res => screenImg.onload = res);
    applyFit();                     // a new shot can have a new natural size
    metaEl.textContent = `${screenW}×${screenH} pt · ${screenImg.naturalWidth}×${screenImg.naturalHeight} px · ${(blob.size/1024).toFixed(0)} KB`;
    lastScreenKB = (blob.size/1024).toFixed(0);
    updateTraffic();
    setStatus('loaded', 'ok');
    setTimeout(() => setStatus('ready'), 1200);
  } catch (e) {
    setStatus('load error: ' + e.message, 'err');
  }
}
// ── fit: use the whole window ────────────────────────────────────────────────
// On by default — the common case here is a tablet or a half-screen window, where 1:1
// leaves most of the area black. Remembered, so a desktop that wants real pixels turns
// it off once. Only the aspect-ratio remainder is ever left over.
const fitChk = document.getElementById('fitChk');
const FIT_KEY = 'cc_remote_pc_fit';
fitChk.checked = (localStorage.getItem(FIT_KEY) ?? '1') === '1';
function applyFit() {
  document.body.classList.toggle('fit', fitChk.checked);
  const nw = screenImg.naturalWidth, nh = screenImg.naturalHeight;
  // The column is where the keys live in every state — before the first screenshot has
  // arrived and with fit turned off (1:1 pixels) too. This used to strip `side` here,
  // which is why the page opened with the keys across the top and only moved them once
  // an image had loaded.
  document.body.classList.add('side');
  if (!fitChk.checked || !nw || !nh) {
    document.body.classList.remove('narrow');
    screenImg.style.width = ''; screenImg.style.height = '';
    return;
  }
  // The keys are ALWAYS the column on the right. They used to move there only when the
  // window was wider than the shot's own aspect (× 1.1 slack), on the theory that the
  // leftover space had to exist first — but a window that is merely a bit wider than
  // tall failed that test and got the old horizontal strip: six groups in a ragged row
  // across the top, eating the height. The column costs 200px of width and gives back
  // ~150px of height, so there is nothing left to decide.
  // Phone = the window is taller than it is wide (or simply too narrow to hold both).
  // There the shot is fitted to the HEIGHT and the page scrolls sideways to the keys,
  // instead of the shot shrinking into the sliver left beside them.
  const narrow = window.innerWidth < window.innerHeight || window.innerWidth < 700;
  document.body.classList.toggle('narrow', narrow);
  // Measured AFTER the class is set: it changes the area the stage gets, and scaling to
  // the old area was the whole bug this function exists to avoid.
  const main = screenImg.closest('main');
  // HEIGHT, always — flush top to bottom, with no band of empty stage above and below
  // it. min(width, height) is what left that band: once the keys took a column, the
  // width became the binding constraint in an ordinary window and the shot shrank to
  // fit it. What does not fit across is panned instead (main scrolls sideways), so the
  // pixels are all still reachable and the keys never scroll away.
  const fitTo = (h) => {
    const k = h / nh;
    if (!(k > 0)) return;
    screenImg.style.width = Math.max(1, Math.floor(nw * k)) + 'px';
    screenImg.style.height = Math.max(1, Math.floor(h)) + 'px';
  };
  fitTo(main.getBoundingClientRect().height);
  // A horizontal scrollbar, if this browser gives them space, eats a few px of height —
  // which would then need a vertical scrollbar to reach. clientHeight knows the real
  // answer once the bar exists, so re-fit to it.
  if (main.scrollHeight > main.clientHeight + 1) fitTo(main.clientHeight);
}
fitChk.addEventListener('change', () => {
  localStorage.setItem(FIT_KEY, fitChk.checked ? '1' : '0');
  applyFit();
});
window.addEventListener('resize', applyFit);

// ── phone: collapse the key column ──────────────────────────────────────────
// Remembered, because whichever way you like it is how you like it every time. The arrow
// says which way it goes: ◀ collapses, ▶ brings it back.
const keysToggle = document.getElementById('keysToggle');
const KEYS_KEY = 'cc_remote_pc_keys';
let keysOn = (localStorage.getItem(KEYS_KEY) ?? '1') === '1';
function applyKeys() {
  document.body.classList.toggle('keys-off', !keysOn);
  keysToggle.textContent = keysOn ? '⌨ ◀' : '⌨ ▶';
  applyFit();            // the stage just changed width — re-fit the shot to it
}
keysToggle.addEventListener('click', () => {
  keysOn = !keysOn;
  localStorage.setItem(KEYS_KEY, keysOn ? '1' : '0');
  applyKeys();
});
applyKeys();             // also performs the first applyFit()

// Same overlay the `type` click-mode opens, summoned without the click: at the last
// place you clicked if there is one, else the middle of the shot.
document.getElementById('typeHere').addEventListener('click', () => {
  if (!screenImg.naturalWidth) { setStatus('load a screenshot first', 'err'); return; }
  const x = (lastTypeAt ? lastTypeAt.x : screenImg.clientWidth / 2);
  const y = (lastTypeAt ? lastTypeAt.y : screenImg.clientHeight / 2);
  const frac = wrapToFractions(x, y);
  if (frac) enterTypeMode(x, y, frac);
});

// Both Loads — the header's and the one in the key column — through one handler.
document.querySelectorAll('.js-load').forEach(b =>
  b.addEventListener('click', () => { resetAutoCount(); loadScreenshot(); }));
window.addEventListener('load', loadScreenshot);

// ── point conversion: screenshot CSS pixels → mac display points ───────────
// The screenshot is rendered at its natural pixel size (max-width: none).
// So a click at CSS (x, y) on the <img> corresponds to:
//   mac_x_local = (x / naturalWidth)  * screenW   (in display points)
//   mac_y_local = (y / naturalHeight) * screenH
// (Backend adds the display origin to reach global event coords.)
function clientToWrap(clientX, clientY) {
  const rect = wrapEl.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}
function wrapToFractions(x, y) {
  // The DISPLAYED size, not the natural one. Identical while the shot is 1:1, and the
  // only correct reading once `fit` scales it — dividing by naturalWidth there put
  // every click at a fraction of where you aimed.
  const w = screenImg.clientWidth || screenImg.naturalWidth;
  const h = screenImg.clientHeight || screenImg.naturalHeight;
  if (!w || !h) return null;
  return { xf: x / w, yf: y / h };
}

// ── click/drag pipeline ────────────────────────────────────────────────────
const DRAG_THRESHOLD = 6;
const DBLCLICK_DELAY = 220;
let mouseStart = null;     // { x, y, t, button, shift, ctrl }
let pendingClick = null;   // setTimeout handle for delayed single-click

function cancelPending() {
  if (pendingClick) { clearTimeout(pendingClick); pendingClick = null; }
}

// After any state-changing action, refresh the screenshot so the user
// sees the result without manually clicking Load. ALSO resets the
// auto-reload tick counter — any explicit user activity counts as
// "still active", so the auto-reloader doesn't hit its safety cap.
// No-op when auto is off (nothing to reset).
function resetAutoCount() { if (autoTimer) autoCount = 0; }
function scheduleReload(delayMs = 500) {
  resetAutoCount();
  clearTimeout(scheduleReload._t);
  scheduleReload._t = setTimeout(loadScreenshot, delayMs);
}

// ── Keybar helpers — used by the special-keys buttons up top. ──────
async function sendKeyPC(key, opts = {}) {
  try {
    await fetch('/remote/api/key', {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ key }),
    });
    setStatus(key + ' ✓', 'ok');
    if (opts.reload) scheduleReload();
  } catch (e) { setStatus('key ✗ ' + e.message, 'err'); }
}
async function sendScrollPC(dx, dy) {
  try {
    await fetch('/remote/api/scroll', {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ dx, dy }),
    });
    setStatus(`scroll ${dy > 0 ? '↑' : '↓'} ${Math.abs(dy)} ✓`, 'ok');
    scheduleReload();
  } catch (e) { setStatus('scroll ✗ ' + e.message, 'err'); }
}
// ── Unlock modal ───────────────────────────────────────────────────
// The field is permanent now, and marked up for a password manager on purpose (see the
// comment on the modal). Filed under the host, so one browser can hold one per machine.
const unlockModal      = document.getElementById('unlockModal');
const unlockWake       = document.getElementById('unlockWake');
const unlockFormEl     = document.getElementById('unlockForm');
const unlockPwdEl      = document.getElementById('unlockPwd');
const unlockId         = (location.hostname || 'mac').split('.')[0];
document.getElementById('unlockUser').value = unlockId;
unlockPwdEl.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { ev.preventDefault(); closeUnlockModal(); }
});
// Through the form: a manager offers to save on submit, never on a click handler.
unlockFormEl.addEventListener('submit', (ev) => { ev.preventDefault(); submitUnlock(); });

function openUnlockModal() {
  // Not cleared here — that would undo an autofill, which is the whole point.
  unlockModal.classList.add('show');
  setTimeout(() => unlockPwdEl && unlockPwdEl.focus(), 50);
}
function closeUnlockModal() {
  unlockModal.classList.remove('show');
  unlockPwdEl.value = '';        // cleared on the way OUT, so it never lingers
}
// Guard against a second submit. CRITICAL: a double-click / double-Enter
// used to send the password TWICE — the first unlocked the Mac, the second
// typed the password into whatever app then had focus (e.g. a chat
// window), leaking it. Once a submit is in flight, disable the button +
// input and refuse re-entry until the modal is closed.
let unlockInFlight = false;
async function submitUnlock() {
  if (unlockInFlight) return;
  const pwd = unlockPwdEl ? unlockPwdEl.value : '';
  if (!pwd) { setStatus('unlock: empty pw', 'err'); return; }
  unlockInFlight = true;
  const sendBtn = document.getElementById('unlockSendBtn');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = 'Sending…'; }
  if (unlockPwdEl) unlockPwdEl.disabled = true;
  try {
    await fetch('/remote/api/unlock', {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({
        password: pwd,
        wake: unlockWake.checked,
        lock_first: true,   // always — never type the password into a focused app
      }),
    });
    setStatus('unlock sent ✓', 'ok');
    // Only now that it is known to work. Chrome/Edge get a deterministic prompt; Safari
    // has no such API and relies on the form markup above.
    try {
      if (window.PasswordCredential && navigator.credentials) {
        await navigator.credentials.store(
          new window.PasswordCredential({ id: unlockId, password: pwd, name: unlockId }));
      }
    } catch (e) { /* declined or unsupported */ }
    closeUnlockModal();
    scheduleReload();
  } catch (e) {
    setStatus('unlock ✗ ' + e.message, 'err');
  } finally {
    unlockInFlight = false;
    // On success the modal (and its lazily-built input) is gone; this
    // only matters when an error left the modal open.
    if (sendBtn && document.body.contains(sendBtn)) { sendBtn.disabled = false; sendBtn.textContent = 'Wake & Send'; }
    if (unlockPwdEl) unlockPwdEl.disabled = false;
  }
}
unlockModal.addEventListener('click', (ev) => {
  if (ev.target === unlockModal) closeUnlockModal();
});

async function runActionPC(action) {
  try {
    await fetch('/remote/api/run', {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ type: action.type, target: action.target || '' }),
    });
    setStatus(action.label + ' ✓', 'ok');
    if (action.reload !== false) scheduleReload();
  } catch (e) { setStatus(action.label + ' ✗ ' + e.message, 'err'); }
}

async function postClick(xf, yf, button, double) {
  try {
    const d = await fetch('/remote/api/click', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ xf, yf, button, double, display: currentDisplay() }),
    }).then(r => r.json());
    setStatus(`${button}${double ? '×2' : ''} @ ${Math.round(d.x)},${Math.round(d.y)} ✓`, 'ok');
    scheduleReload();
  } catch (e) {
    setStatus('click ✗ ' + e.message, 'err');
  }
}

async function postDrag(x1f, y1f, x2f, y2f) {
  try {
    const d = await fetch('/remote/api/drag', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ x1f, y1f, x2f, y2f, display: currentDisplay() }),
    }).then(r => r.json());
    setStatus(`drag ${Math.round(d.from[0])},${Math.round(d.from[1])} → ${Math.round(d.to[0])},${Math.round(d.to[1])} ✓`, 'ok');
    scheduleReload();
  } catch (e) {
    setStatus('drag ✗ ' + e.message, 'err');
  }
}

// Only one zoom popup at a time — a new shift+click replaces the old one.
let currentZoomPopup = null;
function dismissZoomPopup() {
  if (!currentZoomPopup) return;
  const { el, objUrl, timer } = currentZoomPopup;
  if (timer) clearTimeout(timer);
  el.remove();
  if (objUrl) URL.revokeObjectURL(objUrl);
  currentZoomPopup = null;
}

async function showZoomPopup(clientX, clientY, frac) {
  dismissZoomPopup();
  const macX = Math.round(frac.xf * screenW);
  const macY = Math.round(frac.yf * screenH);
  const w = 700, h = 200;
  const url = `/remote/api/cursor_strip?w=${w}&h=${h}&q=75&native_res=true&cx=${macX}&cy=${macY}&display=${currentDisplay()}`;
  try {
    const r = await fetch(url, { headers: authHeaders() });
    if (!r.ok) throw new Error(r.statusText);
    // Backend may clamp the rect near display edges so the crop stays
    // fully on-screen; the actual rect comes back as X-Strip-X/Y/W/H in
    // DISPLAY-LOCAL mac points. Anchor the popup using THAT rect, not the
    // click point — otherwise the overlay drifts at the edges.
    const stripX = parseFloat(r.headers.get('X-Strip-X') || '0');
    const stripY = parseFloat(r.headers.get('X-Strip-Y') || '0');
    const stripW = parseFloat(r.headers.get('X-Strip-W') || String(w));
    const stripH = parseFloat(r.headers.get('X-Strip-H') || String(h));
    const blob = await r.blob();
    const objUrl = URL.createObjectURL(blob);
    const pop = document.createElement('div');
    pop.className = 'zoom-popup';
    const img = document.createElement('img');
    img.src = objUrl;
    // Each mac point maps to (naturalWidth / screenW) browser pixels on
    // the displayed screenshot — image is rendered at its natural size.
    const ratioX = screenImg.naturalWidth  / screenW;
    const ratioY = screenImg.naturalHeight / screenH;
    let dispW = stripW * ratioX;
    let dispH = stripH * ratioY;
    // Shrink the overlay (preserving aspect) if it would not fit in the
    // viewport. Near corners the overlay can drift off its source, but
    // its bounds are guaranteed fully visible.
    const PAD = 10;
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(1, (vw - 2 * PAD) / dispW, (vh - 2 * PAD) / dispH);
    dispW = Math.round(dispW * scale);
    dispH = Math.round(dispH * scale);
    img.style.width  = dispW + 'px';
    img.style.height = dispH + 'px';
    pop.appendChild(img);
    const meta = document.createElement('div');
    meta.className = 'meta';
    pop.appendChild(meta);
    document.body.appendChild(pop);
    await new Promise(res => img.onload = res);
    meta.textContent = `${img.naturalWidth}×${img.naturalHeight} px · ${(blob.size/1024).toFixed(1)} KB · @${(scale*100).toFixed(0)}%`;
    lastCropKB = (blob.size/1024).toFixed(1);
    updateTraffic();
    // Source rect in screenshot natural pixels:
    const srcLeftPx = stripX * ratioX;
    const srcTopPx  = stripY * ratioY;
    // Translate to viewport: wrapEl's current viewport offset + screenshot pixel.
    const wrapRect = wrapEl.getBoundingClientRect();
    let imgViewportLeft = wrapRect.left + srcLeftPx * scale;
    let imgViewportTop  = wrapRect.top  + srcTopPx  * scale;
    // CSS box-sizing:border-box — pop.left = border-edge. img is offset
    // inside by 1.5px border + 2px padding = 3.5px each side.
    let px = imgViewportLeft - 3.5;
    let py = imgViewportTop  - 3.5;
    const popW = dispW + 7, popH = dispH + 7 + 16;     // 16 ≈ meta-line height
    px = Math.max(PAD, Math.min(px, vw - popW - PAD));
    py = Math.max(PAD, Math.min(py, vh - popH - PAD));
    pop.style.left = px + 'px';
    pop.style.top  = py + 'px';
    const timer = setTimeout(dismissZoomPopup, 6000);
    currentZoomPopup = { el: pop, objUrl, timer };
  } catch (e) {
    setStatus('zoom ✗ ' + e.message, 'err');
  }
}

// ── type mode ──────────────────────────────────────────────────────────────
// Click point (in screenshot CSS pixels) + a configurable crop size.
// Overlay covers exactly the area the crop was taken from, so the
// rendered chars appear in place. Input box sits at the bottom of the
// overlay, per-keystroke sent to /api/type.
const TYPE_W_PT = 400;   // points wide on mac
const TYPE_H_PT = 80;    // points tall on mac

// Where the overlay should open when it is summoned from the key bar rather than by a
// click: wherever you last put it.
let lastTypeAt = null;
function enterTypeMode(wrapX, wrapY, frac) {
  lastTypeAt = { x: wrapX, y: wrapY };
  // The overlay sits in wrapEl coords (image-content pixels). We position
  // it from the X-Strip-* headers returned by /api/cursor_strip — those
  // reflect the actual capture rect AFTER any edge-clamp. Using the click
  // point would drift near display edges.
  const ratioX = screenImg.naturalWidth  / screenW;
  const ratioY = screenImg.naturalHeight / screenH;
  const overlay = document.createElement('div');
  overlay.className = 'type-overlay';
  // Initial best-guess position (click-centered, before headers come back)
  // — refined below as soon as the first refreshCrop completes.
  let cssW = Math.round(TYPE_W_PT * ratioX);
  let cssH = Math.round(TYPE_H_PT * ratioY);
  overlay.style.left  = (wrapX - cssW / 2) + 'px';
  overlay.style.top   = (wrapY - cssH / 2) + 'px';
  overlay.style.width  = cssW + 'px';
  overlay.style.height = cssH + 'px';
  const img = document.createElement('img');
  img.className = 'crop';
  overlay.appendChild(img);
  // Bottom bar: input + Send + Live toggle (mirrors /remote/'s live-bar).
  const bar = document.createElement('div');
  bar.className = 'type-bar';
  const input = document.createElement('input');
  input.className = 'live';
  input.placeholder = 'type here → mac';
  input.autocapitalize = 'off'; input.autocorrect = 'off'; input.autocomplete = 'off';
  const sendBtn = document.createElement('button');
  sendBtn.className = 'send';
  sendBtn.textContent = 'Send';
  const liveLabel = document.createElement('label');
  liveLabel.className = 'live-toggle';
  const liveCb = document.createElement('input');
  liveCb.type = 'checkbox';
  liveLabel.appendChild(liveCb);
  liveLabel.appendChild(document.createTextNode(' Live'));
  bar.appendChild(input);
  bar.appendChild(sendBtn);
  bar.appendChild(liveLabel);
  overlay.appendChild(bar);
  liveCb.addEventListener('change', () => {
    liveLabel.classList.toggle('on', liveCb.checked);
  });
  const closeBtn = document.createElement('button');
  closeBtn.className = 'close';
  closeBtn.textContent = '×';
  overlay.appendChild(closeBtn);
  wrapEl.appendChild(overlay);

  const macX = Math.round(frac.xf * screenW);
  const macY = Math.round(frac.yf * screenH);
  let lastBlobUrl = '';
  let refreshTimer = 0;
  async function refreshCrop() {
    try {
      // native_res=true → JPEG keeps full retina pixel count, so a mild
      // browser downscale to dispW×dispH stays sharp.
      const r = await fetch(`/remote/api/cursor_strip?w=${TYPE_W_PT}&h=${TYPE_H_PT}&q=75&native_res=true&cx=${macX}&cy=${macY}&display=${currentDisplay()}`,
                            { headers: authHeaders() });
      if (!r.ok) return;
      // Re-anchor overlay using the actual captured rect (display-local pts).
      const stripX = parseFloat(r.headers.get('X-Strip-X') || '0');
      const stripY = parseFloat(r.headers.get('X-Strip-Y') || '0');
      const stripW = parseFloat(r.headers.get('X-Strip-W') || String(TYPE_W_PT));
      const stripH = parseFloat(r.headers.get('X-Strip-H') || String(TYPE_H_PT));
      // border-box: overlay.width already includes the 2px border. The
      // CSS img inside is width/height 100%, so it fills the content box
      // which is (overlay.width - 2*border) = source-area-in-screenshot.
      overlay.style.left   = (stripX * ratioX - 2) + 'px';
      overlay.style.top    = (stripY * ratioY - 2) + 'px';
      overlay.style.width  = (stripW * ratioX + 4) + 'px';
      overlay.style.height = (stripH * ratioY + 4) + 'px';
      const blob = await r.blob();
      if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = URL.createObjectURL(blob);
      img.src = lastBlobUrl;
      lastCropKB = (blob.size/1024).toFixed(1);
      updateTraffic();
    } catch {}
  }
  refreshCrop();

  function exit() {
    if (refreshTimer) clearTimeout(refreshTimer);
    if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
    overlay.remove();
    document.removeEventListener('mousedown', outsideHandler, true);
  }
  function outsideHandler(ev) {
    if (!overlay.contains(ev.target)) exit();
  }
  document.addEventListener('mousedown', outsideHandler, true);
  closeBtn.addEventListener('click', exit);

  // Per-keystroke: send + debounced crop refresh.
  function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(refreshCrop, 250);
  }
  async function sendBuffered() {
    const text = input.value;
    if (!text) return;
    try {
      await fetch('/remote/api/type', {
        method:'POST',
        headers:{'Content-Type':'application/json', ...authHeaders()},
        body: JSON.stringify({ text }),
      });
      input.value = '';
      scheduleRefresh();
      resetAutoCount();
    } catch (e) {
      setStatus('type ✗ ' + e.message, 'err');
    }
  }
  sendBtn.addEventListener('click', sendBuffered);

  input.addEventListener('keydown', async (ev) => {
    if (ev.key === 'Escape') { ev.preventDefault(); exit(); return; }
    // Send mode (Live OFF): buffer locally; Enter / Send-button flushes.
    // The user can use arrows / Backspace etc to edit the buffer freely
    // (browser default behavior on the <input>) and only ship the final
    // string. Tab and other special keys also stay local.
    if (!liveCb.checked) {
      if (ev.key === 'Enter') { ev.preventDefault(); sendBuffered(); }
      return;
    }
    // Live mode: per-keystroke forwarding (specials → /api/key, modifier
    // combos → /api/key, plain chars → /api/type).
    const KEY_MAP = { Enter:'Return', Tab:'Tab', Backspace:'Backspace', Delete:'ForwardDelete',
                      ArrowUp:'Up', ArrowDown:'Down', ArrowLeft:'Left', ArrowRight:'Right' };
    if (KEY_MAP[ev.key]) {
      ev.preventDefault();
      const mods = [];
      if (ev.metaKey) mods.push('cmd');
      if (ev.ctrlKey) mods.push('ctrl');
      if (ev.altKey)  mods.push('opt');
      if (ev.shiftKey && (mods.length || KEY_MAP[ev.key].length > 1)) mods.push('shift');
      const keySpec = mods.length ? mods.join('+') + '+' + KEY_MAP[ev.key] : KEY_MAP[ev.key];
      try { await fetch('/remote/api/key', { method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()},
                                     body: JSON.stringify({ key: keySpec }) }); } catch {}
      scheduleRefresh();
      if (ev.key === 'Enter') resetAutoCount();
      return;
    }
    if ((ev.metaKey || ev.ctrlKey || ev.altKey) && ev.key.length === 1) {
      ev.preventDefault();
      const mods = [];
      if (ev.metaKey) mods.push('cmd');
      if (ev.ctrlKey) mods.push('ctrl');
      if (ev.altKey)  mods.push('opt');
      if (ev.shiftKey) mods.push('shift');
      const keySpec = mods.join('+') + '+' + ev.key.toLowerCase();
      try { await fetch('/remote/api/key', { method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()},
                                     body: JSON.stringify({ key: keySpec }) }); } catch {}
      scheduleRefresh();
      return;
    }
    if (ev.key.length === 1) {
      ev.preventDefault();
      try { await fetch('/remote/api/type', { method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()},
                                      body: JSON.stringify({ text: ev.key }) }); } catch {}
      scheduleRefresh();
    }
  });
  setTimeout(() => input.focus(), 50);
}

// ── mouse pipeline on the capture layer ────────────────────────────────────
captureEl.addEventListener('contextmenu', (ev) => ev.preventDefault());

captureEl.addEventListener('mousedown', (ev) => {
  if (!screenImg.naturalWidth) return;
  const { x, y } = clientToWrap(ev.clientX, ev.clientY);
  mouseStart = {
    x, y,
    clientX: ev.clientX, clientY: ev.clientY,   // viewport coords for popup positioning
    button: ev.button,                          // 0 left, 1 middle, 2 right
  };
  // Start drawing the drag-line — only actually shown once mouse moves past threshold.
  dragLineEl.style.left = x + 'px';
  dragLineEl.style.top  = y + 'px';
  dragLineEl.style.display = 'none';
});

captureEl.addEventListener('mousemove', (ev) => {
  if (!mouseStart) return;
  const { x, y } = clientToWrap(ev.clientX, ev.clientY);
  const dx = x - mouseStart.x, dy = y - mouseStart.y;
  const dist = Math.hypot(dx, dy);
  if (dist > DRAG_THRESHOLD) {
    captureEl.classList.add('dragging');
    dragLineEl.style.display = 'block';
    // Anchor left edge at mousedown point; rotate by start→cur angle.
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    dragLineEl.style.left = mouseStart.x + 'px';
    dragLineEl.style.top  = mouseStart.y + 'px';
    dragLineEl.style.width = dist + 'px';
    dragLineEl.style.transform = `rotate(${angle}deg)`;
  }
});

captureEl.addEventListener('mouseup', (ev) => {
  if (!mouseStart) return;
  const start = mouseStart;
  mouseStart = null;
  captureEl.classList.remove('dragging');
  dragLineEl.style.display = 'none';
  const { x, y } = clientToWrap(ev.clientX, ev.clientY);
  const dx = x - start.x, dy = y - start.y;
  const dist = Math.hypot(dx, dy);
  const startFrac = wrapToFractions(start.x, start.y);
  const endFrac   = wrapToFractions(x, y);
  if (!startFrac || !endFrac) return;
  pulseAt(start.x, start.y);

  // Drag — fire if moved beyond threshold (any button)
  if (dist > DRAG_THRESHOLD) {
    cancelPending();
    postDrag(startFrac.xf, startFrac.yf, endFrac.xf, endFrac.yf);
    return;
  }

  // Right click — immediate, no delay
  if (start.button === 2) { cancelPending(); postClick(startFrac.xf, startFrac.yf, 'right', false); return; }

  // Left click — schedule single click, dblclick handler may cancel.
  // After the click is posted, the mode radio decides what (if anything)
  // fires on top.
  if (start.button === 0) {
    cancelPending();
    pendingClick = setTimeout(() => {
      pendingClick = null;
      postClick(startFrac.xf, startFrac.yf, 'left', false);
      const m = currentMode();
      if      (m === 'type') { lastTypeAt = { x: start.x, y: start.y }; enterTypeMode(start.x, start.y, startFrac); }
      else if (m === 'zoom') showZoomPopup(start.clientX, start.clientY, startFrac);
    }, DBLCLICK_DELAY);
  }
});

captureEl.addEventListener('dblclick', (ev) => {
  if (!screenImg.naturalWidth) return;
  cancelPending();
  const { x, y } = clientToWrap(ev.clientX, ev.clientY);
  const frac = wrapToFractions(x, y);
  if (!frac) return;
  pulseAt(x, y);
  postClick(frac.xf, frac.yf, 'left', true);
});

// Cancel pending mousedown state if mouse leaves the window (avoids stuck
// drag-state when user releases outside).
window.addEventListener('mouseup', () => {
  if (mouseStart) { mouseStart = null; captureEl.classList.remove('dragging'); dragLineEl.style.display = 'none'; }
});

// Mode radio: exactly one of off / zoom / type / capkeys is active.
//   zoom     → after each click on the screenshot, fire a zoom popup
//              aligned with the click area
//   type     → after each click, enter type-mode (input box + crop overlay
//              that covers the click area)
//   capkeys  → while the cursor is over the screenshot, every key the user
//              presses goes to Mac (preventDefault here, so browser
//              shortcuts like Cmd+R / Cmd+T won't fire on this page;
//              switch back to "off" to use the browser normally)
function currentMode() {
  const r = document.querySelector('input[name="actionMode"]:checked');
  return r ? r.value : 'off';
}

// ── Capture-keys-on-hover ──────────────────────────────────────────
let mouseOverScreen = false;
captureEl.addEventListener('mouseenter', () => { mouseOverScreen = true;  updateHoverCursor(); });
captureEl.addEventListener('mouseleave', () => { mouseOverScreen = false; updateHoverCursor(); });

const PASS_KEY_MAP = {
  Enter:'Return', Tab:'Tab', Escape:'Escape',
  Backspace:'Backspace', Delete:'ForwardDelete',
  ArrowUp:'Up', ArrowDown:'Down', ArrowLeft:'Left', ArrowRight:'Right',
  Home:'Home', End:'End', PageUp:'PageUp', PageDown:'PageDown',
  F1:'F1', F2:'F2', F3:'F3', F4:'F4', F5:'F5', F6:'F6',
  F7:'F7', F8:'F8', F9:'F9', F10:'F10', F11:'F11', F12:'F12',
};

async function forwardKey(ev) {
  const k = ev.key;
  if (PASS_KEY_MAP[k]) {
    const mods = [];
    if (ev.metaKey)  mods.push('cmd');
    if (ev.ctrlKey)  mods.push('ctrl');
    if (ev.altKey)   mods.push('opt');
    if (ev.shiftKey && (mods.length > 0 || PASS_KEY_MAP[k].length > 1)) mods.push('shift');
    const spec = (mods.length ? mods.join('+') + '+' : '') + PASS_KEY_MAP[k];
    await fetch('/remote/api/key', {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ key: spec }),
    });
    setStatus(spec + ' ✓', 'ok');
    return;
  }
  if ((ev.metaKey || ev.ctrlKey || ev.altKey) && k.length === 1) {
    const mods = [];
    if (ev.metaKey)  mods.push('cmd');
    if (ev.ctrlKey)  mods.push('ctrl');
    if (ev.altKey)   mods.push('opt');
    if (ev.shiftKey) mods.push('shift');
    const spec = mods.join('+') + '+' + k.toLowerCase();
    await fetch('/remote/api/key', {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ key: spec }),
    });
    setStatus(spec + ' ✓', 'ok');
    return;
  }
  if (k.length === 1) {
    await fetch('/remote/api/type', {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ text: k }),
    });
    setStatus('typed "' + k + '" ✓', 'ok');
  }
}

// Keys that would otherwise scroll the screenshot's container. In any
// mode that forwards keys to Mac, we want these intercepted so the
// display doesn't scroll behind the user's back.
const SCROLL_KEYS = new Set([
  'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
  'PageUp','PageDown','Home','End', ' ',
]);

// Capture-phase keydown — runs before the browser's default action for
// shortcuts like Ctrl+Cmd+F that the browser might otherwise grab.
document.addEventListener('keydown', (ev) => {
  const mode = currentMode();
  const tgt = ev.target;
  const isInInput = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA');

  // capkeys mode + mouse over the screenshot: forward EVERY non-modifier
  // key (this is the full keyboard passthrough).
  if (mode === 'capkeys' && mouseOverScreen) {
    if (isInInput) return;
    if (['Shift','Control','Alt','Meta'].includes(ev.key)) return;
    ev.preventDefault();
    const k = ev.key;
    forwardKey(ev)
      .then(() => {
        // Only ENTER and ESC reload the screenshot — refreshing on every
        // char would thrash bandwidth during normal typing.
        if (k === 'Enter' || k === 'Escape') scheduleReload();
      })
      .catch(e => setStatus('key ✗ ' + e.message, 'err'));
    return;
  }

  // type or capkeys mode: at minimum, intercept arrow / page / space /
  // home / end so they don't scroll the screenshot's <main> wrapper —
  // forward to Mac instead. type-overlay's own input handler already
  // catches arrows when focused; this is the fallback for when the
  // overlay is closed (or the user clicked outside it).
  if ((mode === 'type' || mode === 'capkeys') && !isInInput && SCROLL_KEYS.has(ev.key)) {
    ev.preventDefault();
    forwardKey(ev).catch(() => {});
  }
}, true);   // ← capture phase

function updateHoverCursor() {
  captureEl.style.cursor = (currentMode() === 'capkeys' && mouseOverScreen) ? 'text' : 'crosshair';
}
document.querySelectorAll('input[name="actionMode"]').forEach(r => r.addEventListener('change', updateHoverCursor));
updateHoverCursor();

</script>
</body>
</html>
