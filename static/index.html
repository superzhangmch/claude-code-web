<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Claude Code — Web</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Claude" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icon-180.png" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
:root {
  --bg: #000;
  --panel: #1c1f2a;
  --panel2: #232735;
  --text: #e6e6ea;
  --muted: #8a8f9c;
  --accent: #e08b4a;
  --assistant: #b691ff;
  --border: #2a2e3e;
  --code-bg: #0f1017;
  --warn: #ff8b6a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  height: 100%; overscroll-behavior: none;
}
body { display: flex; flex-direction: column; height: 100dvh; }

header {
  padding: 10px 14px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: #000;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
  overflow: hidden;
}
header > * { flex-shrink: 0; }
header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }
header .dot.off { background: #888; }
header .dot.err { background: #e04a4a; }
header .mode-group { display: inline-flex; gap: 2px; }
header .mode-group .mode-pick {
  font-weight: normal; padding: 4px 8px;
}
header .mode-group .mode-pick.active {
  font-weight: 700; color: var(--accent);
  border-color: var(--accent);
}
header .meta {
  color: var(--muted); font-size: 12px; margin-left: auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex-shrink: 1; min-width: 0; max-width: 50%;
}
header .traffic {
  color: #6b7280; font: 11px ui-monospace, Menlo, monospace;
}
header .ready {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
}
header .ready.idle::before {
  content: ""; width: 8px; height: 8px;
  border-radius: 50%; background: #6ee884;
}
header .ready.busy::before {
  content: ""; width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid #3a2c1f; border-top-color: #e0a070;
  animation: spin 0.8s linear infinite;
}
header button.icon {
  background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 14px; line-height: 1; padding: 4px 8px;
  cursor: pointer;
}
header button.icon:hover { border-color: var(--accent); }
header button.btn {
  background: var(--panel2); color: var(--muted);
  border: 1px solid var(--border);
  padding: 4px 8px; border-radius: 4px;
  font: inherit; font-size: 11px; cursor: pointer;
}

#warn {
  display: none; padding: 8px 14px;
  background: var(--warn); color: #1b1b1b; font-size: 13px;
  text-align: center; cursor: pointer;
}
#warn.show { display: block; }

main {
  flex: 1; overflow-y: auto; padding: 10px 12px;
}

#picker { display: none; }
header .battery {
  font: 12px ui-monospace, Menlo, monospace;
  color: var(--muted);
}
header .battery.low { color: #ff8b6a; font-weight: 600; }
header .battery .b-icon { margin-right: 3px; }
#picker.show { display: block; }
#picker h2 {
  font-size: 12px; color: var(--muted); margin: 0 0 10px 0;
  font-weight: 500; text-transform: uppercase; letter-spacing: .05em;
}
.session-card {
  background: #000; border: 1px solid #4a4f5e;
  border-radius: 6px; padding: 12px; margin-bottom: 8px;
  cursor: pointer;
}
.session-card:hover { border-color: var(--accent); }
.session-card .title-row { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
.session-card .title { font-weight: 500; font-size: 14px; word-break: break-word; flex: 1; }
.session-card.unnamed .title { font-style: italic; color: var(--muted); }
.session-card .time { font-size: 11px; color: var(--muted); white-space: nowrap; }
.session-card .cwd {
  font: 11px ui-monospace, Menlo, monospace;
  color: var(--muted); word-break: break-all; margin-bottom: 4px;
}
.session-card .preview {
  font-size: 12px; color: var(--text);
  margin-top: 6px; padding-top: 6px;
  border-top: 1px solid var(--border);
  word-break: break-word;
}
.session-card .preview .label {
  color: var(--muted); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px;
}
.session-card .expanded-area {
  display: none; margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border);
}
.session-card.expanded .expanded-area { display: block; }
.session-card .msg-block {
  margin-bottom: 8px; padding: 6px 8px;
  border-radius: 4px; word-break: break-word;
}
.session-card .msg-block.user { background: #000; color: #c8ccd5; border-left: 2px solid var(--accent); }
.session-card .msg-block.claude { background: #000; border-left: 2px solid var(--assistant); }
.session-card .msg-block .ts {
  font-size: 9px; color: var(--muted); margin-bottom: 2px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.session-card .msg-block .body {
  font-size: 12px; line-height: 1.45;
  white-space: pre-wrap;
}
.session-card .attach-row {
  margin-top: 10px; display: flex; gap: 6px; justify-content: flex-end;
}
.session-card .attach-row button {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 6px 14px; font-weight: 600; font-size: 12px; cursor: pointer;
}
.session-card .attach-row button.detach { color: var(--muted); }
.session-card .attach-row button.detach:hover { color: #ff8b6a; border-color: #ff6a6a; }
.session-card .chevron {
  font-size: 12px; color: var(--muted);
  transition: transform 0.15s; display: inline-block;
  margin-left: 8px;
}
.session-card.expanded .chevron { transform: rotate(90deg); }
.session-card .badges { display: inline-flex; gap: 6px; }
.session-card .badge {
  font-size: 9px; padding: 1px 5px; border-radius: 3px;
  letter-spacing: 0.05em; text-transform: uppercase;
}
.session-card .badge.bound { background: #1f3a26; color: #6ee884; }
.session-card .badge.unnamed { background: #3a3f4e; color: #aaa; }

#transcript-view { display: none; }
#transcript-view.show { display: block; }

.msg {
  margin: 0 0 14px 0; padding: 10px 14px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-left: 2px solid var(--assistant);
  border-radius: 4px;
}
.msg.user {
  border-left-color: var(--accent);
  background: #000; color: #9aa0ab;
  margin-left: 32px;
}
.msg.user .markdown { color: #9aa0ab; }
.msg.assistant { background: #000; }
.msg.tool { border-left-color: #4ec9b0; background: #1a211f; }
.msg.thinking { border-left-color: #7a7a7a; background: #1a1a22; font-style: italic; color: var(--muted); }
.msg .role {
  text-transform: uppercase; font-size: 10px;
  letter-spacing: 0.06em; color: var(--muted);
  margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
}
.msg .role .idx {
  color: #5a5f6c; font-size: 10px; font-weight: normal;
  letter-spacing: 0; text-transform: none; margin-left: auto;
}
.msg .copy-btn {
  background: transparent; color: var(--muted);
  border: 0; cursor: pointer; padding: 0 2px 0 6px;
  line-height: 0;
  display: inline-flex; align-items: center;
}
.msg .copy-btn:hover { color: var(--text); }
.msg .copy-btn svg { display: block; }
.msg .copy-btn.done { color: #6ee884; }
.msg .markdown { word-break: break-word; }
.msg .markdown p { margin: 0 0 .7em 0; }
.msg .markdown p:last-child { margin-bottom: 0; }
.msg .markdown h1, .msg .markdown h2, .msg .markdown h3 { margin: .8em 0 .4em 0; line-height: 1.3; }
.msg .markdown code {
  background: var(--code-bg); padding: 1px 5px; border-radius: 3px;
  font: 13px ui-monospace, Menlo, monospace;
}
.msg .markdown pre {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 10px 12px; overflow-x: auto; margin: .5em 0;
}
.msg .markdown pre code { background: none; padding: 0; font-size: 12.5px; }
.msg .markdown ul, .msg .markdown ol { margin: .3em 0 .7em 1.4em; padding: 0; }
.msg .markdown a { color: var(--accent); }
.msg .markdown .table-wrap {
  max-width: 100%; overflow-x: auto;
  margin: .5em 0;
  -webkit-overflow-scrolling: touch;
}
.msg .markdown table {
  border-collapse: collapse; margin: 0;
  font-size: 12.5px;
  min-width: max-content;
}
.msg .markdown td, .msg .markdown th { white-space: nowrap; }
.msg .markdown th, .msg .markdown td {
  border: 1px solid var(--border);
  padding: 4px 8px; text-align: left; vertical-align: top;
}
.msg .markdown th { background: var(--code-bg); font-weight: 600; }
.msg .markdown tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
.msg .tool-call {
  font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap;
  word-break: break-word; background: var(--code-bg);
  border-radius: 4px; padding: 8px 10px;
}
.msg .tool-call .tname { color: #4ec9b0; font-weight: 600; }
.msg .tool-call .targs { color: #cbd0da; margin-top: 4px; max-height: 180px; overflow-y: auto; }
.msg .tool-call .targs-table-wrap {
  margin-top: 4px;
  max-height: 300px; overflow: auto;
}
.msg .tool-call .targs-table {
  border-collapse: collapse;
  width: 100%; font-size: 12px;
  font-family: ui-monospace, Menlo, monospace;
}
.msg .tool-call .targs-table tr { border-bottom: 1px dashed var(--border); }
.msg .tool-call .targs-table tr:last-child { border-bottom: 0; }
.msg .tool-call .targs-table .targs-k {
  vertical-align: top; padding: 4px 8px 4px 0;
  color: #4ec9b0; white-space: nowrap; font-weight: 500;
}
.msg .tool-call .targs-table .targs-v {
  vertical-align: top; padding: 4px 0;
  color: #cbd0da; white-space: pre;
}
.msg .tool-call .targs-table .targs-v pre {
  margin: 0; white-space: pre;
  font-family: inherit; font-size: inherit;
}
.msg .tool-result-box {
  font: 12.5px/1.4 ui-monospace, Menlo, monospace; white-space: pre;
  background: var(--code-bg);
  border-radius: 4px; padding: 8px 10px; max-height: 300px; overflow: auto;
}
/* Inline result inside the tool-call box (merged adjacent pair). */
.msg .tool-call .tool-result-inline {
  margin-top: 10px; padding-top: 6px;
  border-top: 1px dashed var(--border);
}
.msg .tool-call .tool-result-inline .rlabel {
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.msg .tool-call .tool-result-inline.is-error .rlabel { color: #ff8b8b; }
.msg .tool-call .tool-result-inline .rlabel-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
}
.msg .tool-call .tool-result-inline .rlabel-row .rlabel { margin-bottom: 0; }
.msg .tool-call .tool-result-inline .rlabel-row .copy-btn { margin-left: auto; }
/* Wrap-toggle: when active, long lines re-wrap inside the block. */
.msg .wrap-btn {
  background: transparent; color: var(--muted);
  border: 0; cursor: pointer; padding: 0 4px;
  font-size: 13px; line-height: 1;
}
.msg .wrap-btn:hover { color: var(--text); }
.msg .wrap-btn.active { color: var(--accent); }
/* Card-level wrap toggle now scopes to args only — merged result keeps
   its own independent toggle inside .tool-result-inline. */
.msg .tool-call.wrap-on .targs-v,
.msg .tool-call.wrap-on .targs-v pre {
  white-space: pre-wrap; word-break: break-word;
}
.msg .tool-result-box.wrap-on {
  white-space: pre-wrap; word-break: break-word;
}
.msg .tool-result-box.is-error { color: #ff8b8b; }

.gap {
  margin: 6px 0 14px 0; padding: 8px 12px;
  background: var(--panel); border: 1px dashed var(--border);
  border-radius: 4px; text-align: center; color: var(--muted);
  font-size: 12px; cursor: pointer;
}
.gap:hover { border-color: var(--accent); }
.gap.loading { opacity: 0.6; }

#load-earlier { display: none; text-align: center; padding: 6px 0 12px; }
#load-earlier.show { display: block; }

#autoload {
  display: none; justify-content: center;
  padding: 10px 0 4px 0; cursor: pointer;
}
#autoload.show { display: flex; }
#autoload .indicator {
  display: inline-flex; gap: 4px;
  padding: 4px 10px; border-radius: 12px;
  background: var(--panel); color: var(--muted); font-size: 11px;
  align-items: center;
}
#autoload .indicator .dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent); opacity: 0.3;
  animation: pulse 1.2s infinite ease-in-out;
}
#autoload .indicator .dot:nth-child(2) { animation-delay: 0.2s; }
#autoload .indicator .dot:nth-child(3) { animation-delay: 0.4s; }
#autoload.paused .indicator .dot { animation: none; opacity: 0.35; background: #666; }
/* Auto-refresh stopped (claude idle or activity-timeout) — colour the
   prompt red so the user actually notices they need to tap. */
#autoload.paused .indicator { color: #ff6a6a; font-weight: 600; }
/* Brief feedback state while a manual one-shot fetch is in flight. */
#autoload.checking .indicator {
  color: var(--accent); font-weight: 600;
  animation: pulse-soft 0.6s infinite ease-in-out;
}
#autoload.checking .indicator .dot {
  animation: pulse 0.4s infinite ease-in-out !important;
  opacity: 1; background: var(--accent);
}
@keyframes pulse-soft {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.3; }
  40% { opacity: 1; }
}

footer {
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom);
  background: #000; border-top: 1px solid var(--border);
  display: flex; flex-direction: column;
}
footer .input-row {
  display: flex; gap: 8px; padding: 8px 10px;
}
footer.hidden { display: none; }
footer textarea {
  flex: 1; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; resize: none;
  font: 16px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  min-height: 40px; max-height: 30vh;
}
footer button {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 0 10px; font-weight: 600; font-size: 13px;
  cursor: pointer; flex-shrink: 0;
}
footer button:disabled { opacity: 0.4; cursor: not-allowed; }
footer .prompt-row {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: #1c1f0e;
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 6px;
}
footer .prompt-row .pq {
  font-size: 12px; color: #f0d050; font-weight: 600;
  white-space: pre-wrap; word-break: break-word;
}
footer .prompt-row .pchoices {
  display: flex; flex-wrap: wrap; gap: 6px;
}
footer .prompt-row .pchoice {
  background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; font-size: 13px; cursor: pointer;
  text-align: left; max-width: 100%;
}
footer .prompt-row .pchoice .pdigit {
  display: inline-block; min-width: 18px;
  color: var(--accent); font-weight: 700; margin-right: 6px;
}
footer .prompt-row .pchoice.default {
  border-color: var(--accent);
  background: #28311a;
}
footer .prompt-row .pchoice:hover { background: var(--code-bg); }
footer button.icon {
  background: var(--panel2); color: var(--muted);
  font-weight: normal; font-size: 15px; min-width: 28px; padding: 0;
}
.upload-row {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 4px 10px 0;
}
.upload-row .pill {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--panel2); color: var(--muted);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 2px 6px 2px 8px;
  font: 11px ui-monospace, Menlo, monospace;
}
.upload-row .pill .x {
  cursor: pointer; padding: 0 4px;
  color: var(--muted); border-radius: 50%;
}
.upload-row .pill .x:hover { color: #ff8b6a; }
.upload-row .pill img {
  width: 24px; height: 24px; object-fit: cover; border-radius: 3px;
}

/* loading overlay */
.loading {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 300; padding: 20px;
}
.loading.show { display: flex; }
.loading-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 22px 28px;
  display: flex; align-items: center; gap: 14px;
  font: 13px ui-monospace, Menlo, monospace; color: var(--text);
}
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* modal */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.modal.show { display: flex; }
.modal-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 18px;
  width: 100%; max-width: 480px;
  max-height: 80vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
}
.modal-card h2 { margin: 0; font-size: 15px; }
.modal-card p { margin: 0; color: var(--muted); font-size: 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 6px; }
.modal-actions button {
  background: var(--panel2); color: var(--muted);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
}
.modal-actions button.primary {
  background: var(--accent); color: #1b1b1b; border: 0;
  font-weight: 600; font-size: 13px; padding: 6px 16px;
}
.modal-actions button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

#newdlg-cwds, #candidates { display: flex; flex-direction: column; gap: 6px; }
#newdlg-cwds button {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 12px; font: 12px ui-monospace, Menlo, monospace;
  cursor: pointer; text-align: left; word-break: break-all;
}
#newdlg-cwds button:hover, #newdlg-cwds button.selected { border-color: var(--accent); background: var(--panel2); }
.candidate {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 0; cursor: pointer;
  overflow: hidden;
}
.candidate:hover { border-color: var(--accent); }
.candidate.selected { border-color: var(--accent); background: var(--panel2); }
.candidate.llm-pick {
  border-color: var(--accent); border-width: 2px; padding: 9px 0;
  box-shadow: 0 0 0 2px rgba(255, 168, 75, 0.15);
}
.candidate .evidence {
  margin: 0 10px 4px;
  font: 11px/1.4 ui-monospace, Menlo, monospace;
}
.candidate .evidence .pair {
  display: grid; grid-template-columns: 60px 1fr; gap: 0 12px;
  padding: 3px 0; border-top: 1px dashed var(--border);
}
.candidate .evidence .pair:first-child { border-top: 0; }
.candidate .evidence .pair .label {
  color: var(--muted); text-align: right;
}
.candidate .evidence .pair .text { color: var(--text); word-break: break-all; }
.candidate .evidence .pair.transcript .label { color: var(--accent); }
.candidate .evidence .pair.screen .label { color: var(--assistant); }
.candidate .evidence .pair.screen .label .vmark { margin-right: 3px; font-weight: 700; }
.candidate .evidence .pair.screen .label .vmark.ok { color: #6ee884; }
.candidate .evidence .pair.screen .label .vmark.fake { color: #ff6a6a; }
.candidate .screen-tail .match-hl {
  color: #ff6a6a; font-weight: 700;
}
.candidate .evidence .verdict {
  display: inline-block; font-size: 9px; font-weight: 600;
  padding: 1px 5px; border-radius: 3px; letter-spacing: 0.05em;
  text-transform: uppercase; margin-left: 6px;
}
.candidate .evidence .verdict.ok { background: #1f3a26; color: #6ee884; }
.candidate .evidence .verdict.fake { background: #3a1f1f; color: #ff8b6a; }
.candidate.conflict {
  border-color: #ff6a6a;
  box-shadow: inset 0 0 0 1px rgba(255,107,107,0.3);
}
.candidate .candidate-conflict {
  margin: 0 10px 4px;
  color: #ff8b6a; font-size: 11px; font-weight: 500;
  font-family: ui-monospace, Menlo, monospace;
}
.candidate .card-confirm-row {
  margin: 6px 10px 0; display: flex; justify-content: flex-end;
}
.candidate .card-confirm {

</head>
<body>
  <header>
    <span id="status-dot" class="dot off"></span>
    <span id="meta" class="meta"></span>
    <span id="ready" class="ready" style="display:none"></span>
    <span id="traffic" class="traffic"></span>
    <span id="mode-group" class="mode-group" style="display:none">
      <button class="btn mode-pick" data-mode="brief" title="brief">▁</button>
      <button class="btn mode-pick" data-mode="medium" title="medium">▄</button>
      <button class="btn mode-pick" data-mode="all" title="all">█</button>
    </span>
    <button id="info-btn" class="btn icon" style="display:none" title="Session info">ⓘ</button>
    <button id="screen-btn" class="btn icon" style="display:none" title="Show iTerm screen">🖥</button>
    <span id="battery" class="battery" style="display:none"></span>
    <button id="refresh-btn" class="btn icon" style="display:none" title="Refresh list">↻</button>

  <div id="info-modal" class="modal">

      </div>
      <table id="info-body" class="info-table"></table>

  <div id="screen-modal" class="modal">
    <div class="modal-card screen-card">
      <div class="modal-row">
        <h3>iTerm screen</h3>
        <button id="screen-refresh" class="btn">↻</button>
        <button id="screen-close" class="btn">close</button>
      </div>
      <pre id="screen-body" class="screen-body">…</pre>
      <div class="modal-row screen-actions">
        <button id="key-esc" class="btn" title="Send ESC">ESC</button>
        <button id="key-opt1" class="btn" title="Send Enter (selects option 1 / current)">ENTER (opt1)</button>
        <button id="key-opt2" class="btn" title="Down + Enter (option 2)">OPT2</button>

  <div id="warn" title="tap to re-verify"></div>

  <main id="main">
    <div id="picker">
      <h2 id="picker-title">Recent sessions</h2>

    <div id="transcript-view">

      <div id="transcript"></div>
      <div id="autoload">
        <span class="indicator">

  <!-- attach loading overlay -->

  <!-- new session dialog -->

    <div class="modal-card">
      <h2>New Claude session</h2>

  <!-- login -->
  <div id="login">
    <form id="login-form" autocomplete="off">
      <h2>Auth required</h2>
      <p>Paste the token printed by the server (or set <code>CC_WEB_TOKEN</code>).</p>
      <input type="password" id="login-token" placeholder="token" autocomplete="off" />
      <div class="err" id="login-err">Invalid token</div>
      <button type="submit">Unlock</button>
    </form>
  </div>

<script>
(() => {
  const TOKEN_KEY = "cc_web_token";
  let authToken = localStorage.getItem(TOKEN_KEY) || "";
  const loginEl = document.getElementById("login");
  const loginForm = document.getElementById("login-form");
  const loginTokenInput = document.getElementById("login-token");
  const loginErr = document.getElementById("login-err");

  function showLogin(err) {
    loginEl.classList.add("show");
    loginErr.classList.toggle("show", !!err);
    loginTokenInput.value = "";
    setTimeout(() => loginTokenInput.focus(), 50);
  }
  function hideLogin() { loginEl.classList.remove("show"); }

  async function tryLogin(token) {
    const resp = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token }),
    });
    return resp.ok;
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const tok = loginTokenInput.value.trim();
    if (!tok) return;
    if (await tryLogin(tok)) {
      authToken = tok;
      localStorage.setItem(TOKEN_KEY, tok);
      hideLogin();
      start();
    } else showLogin(true);
  });

  let traffic = { in_bytes: 0, out_bytes: 0 };
  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + " MB";
    return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
  }
  const trafficEl = document.getElementById("traffic");
  function renderTraffic() {
    trafficEl.textContent = "↓" + fmtBytes(traffic.out_bytes) + " ↑" + fmtBytes(traffic.in_bytes);
  }
  renderTraffic();

  async function authedFetch(url, opts = {}) {
    opts.headers = { ...(opts.headers || {}), "Authorization": "Bearer " + authToken };
    opts.cache = "no-store";
    const reqBytes = opts.body ? (typeof opts.body === "string" ? new Blob([opts.body]).size : 0) : 0;
    const resp = await fetch(url, opts);
    if (resp.status === 401) {
      authToken = ""; localStorage.removeItem(TOKEN_KEY); showLogin(false);
    }
    try {
      const buf = await resp.clone().arrayBuffer();
      traffic.in_bytes += reqBytes;
      traffic.out_bytes += buf.byteLength;
      renderTraffic();
    } catch {}
    return resp;
  }

  // ---------- markdown rendering ----------
  marked.setOptions({ gfm: true, breaks: true });
  const URL_RE = /(https?:\/\/[^\s<>"'）)\]]+)/g;
  function renderMarkdown(text) {
    let html = "";
    try { html = marked.parse(text || ""); } catch { html = (text || ""); }
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    // Wrap every <table> in a scrollable div so wide tables don't blow out
    // the message bubble on narrow screens (phone). The table keeps its
    // native cell layout; the wrapper provides horizontal scroll only when
    // the table actually exceeds the viewport.
    tmp.querySelectorAll("table").forEach(t => {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    tmp.querySelectorAll("a").forEach(a => {
      const t = (a.textContent || "").trim();
      if (/^https?:\/\//i.test(t)) {
        a.replaceWith(document.createTextNode(a.textContent || ""));
      } else {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      }
    });
    const walker = document.createTreeWalker(tmp, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue || !node.nodeValue.includes("http")) return NodeFilter.FILTER_REJECT;
        const p = node.parentElement;
        if (p && (p.closest("a") || p.closest("code") || p.closest("pre"))) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      },
    });
    const targets = [];
    let n;
    while ((n = walker.nextNode())) targets.push(n);
    for (const node of targets) {
      const parts = node.nodeValue.split(URL_RE);
      if (parts.length === 1) continue;
      const frag = document.createDocumentFragment();
      for (const p of parts) {
        if (/^https?:\/\//.test(p)) {
          const a = document.createElement("a");
          a.href = p; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.textContent = p; frag.appendChild(a);
        } else if (p) {
          frag.appendChild(document.createTextNode(p));
        }
      }
      node.parentNode.replaceChild(frag, node);
    }
    return tmp.innerHTML;
  }

  // ---------- DOM refs ----------
  const statusDot = document.getElementById("status-dot");
  const metaEl = document.getElementById("meta");
  const readyEl = document.getElementById("ready");
  const modeGroup = document.getElementById("mode-group");
  const modePicks = Array.from(document.querySelectorAll(".mode-pick"));
  const backBtn = document.getElementById("back-btn");
  const newBtn = document.getElementById("new-btn");
  const warnEl = document.getElementById("warn");
  const pickerEl = document.getElementById("picker");
  const pickerListEl = document.getElementById("picker-list");
  const tvEl = document.getElementById("transcript-view");
  const transcriptEl = document.getElementById("transcript");
  const autoloadEl = document.getElementById("autoload");
  const autoloadLabel = document.getElementById("autoload-label");
  const loadEarlierEl = document.getElementById("load-earlier");
  const loadEarlierBtn = document.getElementById("load-earlier-btn");
  const footerEl = document.getElementById("footer");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const mainEl = document.getElementById("main");
  const promptRowEl = document.getElementById("prompt-row");
  const promptQuestionEl = document.getElementById("prompt-question");
  const promptChoicesEl = document.getElementById("prompt-choices");
  const screenBtn = document.getElementById("screen-btn");
  const screenModal = document.getElementById("screen-modal");
  const screenBody = document.getElementById("screen-body");
  const screenRefresh = document.getElementById("screen-refresh");
  const screenClose = document.getElementById("screen-close");
  const refreshBtn = document.getElementById("refresh-btn");
  const infoBtn = document.getElementById("info-btn");
  const infoModal = document.getElementById("info-modal");
  const infoBody = document.getElementById("info-body");
  const infoClose = document.getElementById("info-close");

  // ---------- state ----------
  let attachedSid = null;        // currently-viewing claude_session_id
  let attachedShort = "";        // first 4 chars (for mismatch comparison)
  let entryCache = [];
  let earliestIdxLoaded = null;
  let lastIdx = null;
  let hasMoreHistory = false;
  let claudeIdle = false;
  let isPaused = false;
  // Why polling stopped, when isPaused is true:
  //   "manual"  → user tapped while polling was active. Tap-to-resume
  //                should restart auto-polling for the full window.
  //   "timeout" → no new content within ACTIVITY_TIMEOUT_MS. Tap-to-
  //                resume does a one-shot fetch and stays stopped if
  //                nothing new came in.
  let pauseReason = null;
  let polling = false;
  let pollTimer = null;
  // Tracks the most-recent block currently at the bottom of the transcript
  // *if* that block is a tool_use. A tool_result that comes next can then
  // be folded into the same card. Reset whenever the bottom is no longer
  // a tool_use (text/thinking/standalone tool_result rendered, transcript
  // rebuilt, or user navigated away).
  let _lastBottomToolUse = null;
  let activityDeadline = 0;
  let renderMode = localStorage.getItem("cc_mode") || "brief";
  let shouldAutoscroll = true;

  const POLL_INTERVAL_MS = 5000;
  const ACTIVITY_TIMEOUT_MS = 2 * 60 * 1000;

  mainEl.addEventListener("scroll", () => {
    const nearBottom = mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight < 40;
    shouldAutoscroll = nearBottom;
  });
  function scrollToBottom() {
    if (shouldAutoscroll) mainEl.scrollTop = mainEl.scrollHeight;
  }

  function setReady(idle) {
    if (idle === null || idle === undefined) { readyEl.style.display = "none"; return; }
    readyEl.style.display = "";
    readyEl.className = "ready " + (idle ? "idle" : "busy");
    readyEl.textContent = "";
    readyEl.title = idle ? "ready" : "busy";
  }

  function setStatus(s) {
    statusDot.className = "dot " + (s === "ok" ? "" : s === "err" ? "err" : "off");
  }

  // Server tells us when to show a confirmation menu via m.pending_confirm.
  // Each option N maps to: (N-1) DownArrows + Enter — works regardless of
  // whether the menu is digit-shortcutted or arrow-key driven, because
  // option 1 is the default selection in claude's prompts.
  let lastPromptKey = "";
  async function postQuickReply(idx) {
    if (!attachedSid) return;
    const downs = "\x1b[B".repeat(Math.max(0, idx - 1));
    try {
      await authedFetch("/api/input", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          claude_session_id: attachedSid,
          text: downs,
          press_enter: true,
        }),
      });
    } catch {}
    // Hide immediately for snappy feel; next poll will re-show if claude
    // still expects input (e.g., a follow-up prompt appears).
    promptRowEl.style.display = "none";
    lastPromptKey = "";
    keepAlive();
    schedulePoll(300);
  }

  function updatePromptRow(pending) {
    if (!pending || !pending.choices || pending.choices.length < 2) {
      promptRowEl.style.display = "none";
      lastPromptKey = "";
      return;
    }
    // Avoid re-rendering buttons every poll if the menu is unchanged.
    const key = pending.choices.map(c => c.idx + "·" + c.text).join("|")
              + "?" + (pending.question || "");
    if (key === lastPromptKey && promptRowEl.style.display !== "none") return;
    lastPromptKey = key;
    promptQuestionEl.textContent = pending.question || "Claude is waiting for a choice:";
    promptChoicesEl.innerHTML = "";
    for (const c of pending.choices) {
      const btn = document.createElement("button");
      btn.className = "pchoice" + (c.idx === 1 ? " default" : "");
      const d = document.createElement("span"); d.className = "pdigit"; d.textContent = c.idx;
      const t = document.createElement("span"); t.textContent = c.text;
      btn.appendChild(d); btn.appendChild(t);
      btn.addEventListener("click", () => postQuickReply(c.idx));
      promptChoicesEl.appendChild(btn);
    }
    promptRowEl.style.display = "";
  }

  // ---------- views ----------
  function showPicker() {
    pickerEl.classList.add("show");
    tvEl.classList.remove("show");
    footerEl.classList.add("hidden");
    backBtn.style.display = "none";
    modeGroup.style.display = "none";
    screenBtn.style.display = "none";
    infoBtn.style.display = "none";
    newBtn.style.display = "";
    refreshBtn.style.display = "";
    setReady(null);
    metaEl.textContent = "";
    setStatus("off");
    promptRowEl.style.display = "none";
    lastPromptKey = "";
    _lastBottomToolUse = null;
    refreshPicker();
  }

  function showTranscript() {
    pickerEl.classList.remove("show");
    tvEl.classList.add("show");
    footerEl.classList.remove("hidden");
    backBtn.style.display = "";
    modeGroup.style.display = "";
    screenBtn.style.display = "";
    infoBtn.style.display = "";
    newBtn.style.display = "none";
    refreshBtn.style.display = "none";
    batteryEl.style.display = "none";  // header version is picker-only
    refreshModeButtons();
    setStatus("ok");
  }

  async function loadScreen() {
    if (!attachedSid) return;
    screenBody.textContent = "Loading…";
    try {
      const resp = await authedFetch("/api/screen?claude_session_id=" + encodeURIComponent(attachedSid));
      if (!resp.ok) {
        screenBody.textContent = "Error: " + resp.status + " " + resp.statusText;
        return;
      }
      const j = await resp.json();
      screenBody.textContent = j.screen || "(empty)";
      // Scroll to bottom — most recent output is what the user usually wants.
      screenBody.scrollTop = screenBody.scrollHeight;
    } catch (e) {
      screenBody.textContent = "Error: " + e;
    }
  }
  screenBtn.addEventListener("click", () => {
    screenModal.classList.add("show");
    loadScreen();
  });
  screenRefresh.addEventListener("click", loadScreen);
  screenClose.addEventListener("click", () => screenModal.classList.remove("show"));
  screenModal.addEventListener("click", (e) => {
    if (e.target === screenModal) screenModal.classList.remove("show");
  });

  // Send raw bytes (escape seqs allowed) to the bound iTerm tab, then
  // refresh the screen view so the user can see what happened.
  // press_enter:false because we encode \r ourselves when needed — that
  // way we can send a bare ESC without an extra Enter sneaking in.
  async function sendRaw(text) {
    if (!attachedSid) return;
    try {
      await authedFetch("/api/input", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          claude_session_id: attachedSid,
          text,
          press_enter: false,
        }),
      });
    } catch {}
    // Brief grace so claude can process and redraw, then refresh.
    setTimeout(loadScreen, 300);
  }
  document.getElementById("key-esc").addEventListener("click", () => sendRaw("\x1b"));
  document.getElementById("key-opt1").addEventListener("click", () => sendRaw("\r"));
  document.getElementById("key-opt2").addEventListener("click", () => sendRaw("\x1b[B\r"));
  document.getElementById("key-opt3").addEventListener("click", () => sendRaw("\x1b[B\x1b[B\r"));

  // Render the descendant process list as a small tree:
  //   58147 [02:14:33] /opt/homebrew/.../node /opt/.../claude --resume xxx
  //     58200 [02:14:30] sh -c …
  // Full command kept as-is — info modal's pre cell wraps long lines.
  function fmtProcesses(procs, rootPid) {
    if (!procs || !procs.length) return "(none)";
    const childrenByParent = {};
    for (const p of procs) {
      (childrenByParent[p.ppid] = childrenByParent[p.ppid] || []).push(p);
    }
    const root = procs.find(p => p.pid === rootPid) || procs[0];
    const lines = [];
    function walk(p, depth) {
      const indent = "  ".repeat(depth);
      lines.push(`${indent}${p.pid} [${p.etime}] ${p.command}`);
      const kids = childrenByParent[p.pid] || [];
      kids.sort((a, b) => a.pid - b.pid);
      for (const k of kids) walk(k, depth + 1);
    }
    walk(root, 0);
    return lines.join("\n");
  }

  function fmtBytes(n) {
    if (typeof n !== "number" || n < 0) return String(n);
    if (n < 1024) return n + " B";

  // Length cutoff for highlighting: too short and we'd light up common
  // English fragments (the, and, to). Six chars is roughly 1-2 words,
  // enough to be meaningful but tolerant of small token differences.
  const MATCH_HL_MIN = 6;

  // Longest common substring (LCS in the contiguous sense). Returns the
  // {start,length} of the LCS as positioned within `b`. O(|a|*|b|) DP
  // with two rolling rows. Empty result → length 0.
  function longestCommonSubstring(a, b) {
    const n = a.length, m = b.length;
    if (!n || !m) return { start: 0, length: 0 };
    let prev = new Int32Array(m + 1);
    let curr = new Int32Array(m + 1);
    let bestLen = 0, bestEndInB = 0;
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        if (a[i-1] === b[j-1]) {
          curr[j] = prev[j-1] + 1;
          if (curr[j] > bestLen) { bestLen = curr[j]; bestEndInB = j; }
        } else {
          curr[j] = 0;
        }
      }
      const tmp = prev; prev = curr; curr = tmp; curr.fill(0);
    }
    return { start: bestEndInB - bestLen, length: bestLen };
  }

  // Build a DocumentFragment for `target`, with the longest substring
  // shared with `against` wrapped in <span class="match-hl">. Falls back
  // to plain text if the overlap is too short to be useful.
  function highlightOverlap(target, against) {
    const frag = document.createDocumentFragment();
    if (!target) return frag;
    if (!against) { frag.appendChild(document.createTextNode(target)); return frag; }
    const m = longestCommonSubstring(against, target);
    if (m.length < MATCH_HL_MIN) {
      frag.appendChild(document.createTextNode(target));
      return frag;
    }
    if (m.start > 0) frag.appendChild(document.createTextNode(target.slice(0, m.start)));
    const span = document.createElement("span");
    span.className = "match-hl";
    span.textContent = target.slice(m.start, m.start + m.length);
    frag.appendChild(span);
    if (m.start + m.length < target.length) {
      frag.appendChild(document.createTextNode(target.slice(m.start + m.length)));
    }
    return frag;
  }

  // LCS with masked positions — masked-out positions in either string
  // can't participate in any match. Used by multi-pass LCS below.
  function lcsWithMasks(a, b, aMask, bMask) {
    const n = a.length, m = b.length;
    let prev = new Int32Array(m + 1);
    let curr = new Int32Array(m + 1);
    let bestLen = 0, bestEndA = 0, bestEndB = 0;
    for (let i = 1; i <= n; i++) {
      const ma = aMask[i-1];
      for (let j = 1; j <= m; j++) {
        if (ma || bMask[j-1] || a[i-1] !== b[j-1]) {
          curr[j] = 0;
        } else {
          curr[j] = prev[j-1] + 1;
          if (curr[j] > bestLen) {
            bestLen = curr[j]; bestEndA = i; bestEndB = j;
          }
        }
      }
      const tmp = prev; prev = curr; curr = tmp; curr.fill(0);
    }
    return { aStart: bestEndA - bestLen, bStart: bestEndB - bestLen, length: bestLen };
  }

  // Find ALL non-overlapping common substrings of length >= MIN_LEN
  // between `screen` and `tailText`. Returns ranges (within tailText)
  // sorted ascending. Greedy multi-pass: each pass takes the longest
  // remaining LCS, then masks both regions and repeats.
  function findAllCommonRanges(tailText, screen, MIN_LEN) {
    const ranges = [];
    const tMask = new Uint8Array(tailText.length);
    const sMask = new Uint8Array(screen.length);
    while (true) {
      const m = lcsWithMasks(tailText, screen, tMask, sMask);
      if (m.length < MIN_LEN) break;
      ranges.push({ start: m.aStart, end: m.aStart + m.length });
      for (let k = m.aStart; k < m.aStart + m.length; k++) tMask[k] = 1;
      for (let k = m.bStart; k < m.bStart + m.length; k++) sMask[k] = 1;
    }
    ranges.sort((a, b) => a.start - b.start);
    return ranges;
  }

  // Build a fragment for the iTerm screen-tail with every OK-verified
  // mp.screen highlighted. Strategy:
  //   1. exact substring (covers the common verbatim case)
  //   2. multi-pass LCS to catch slightly-different formatting where the
  //      snippet matches in several disjoint pieces
  // Then merge any two ranges separated only by whitespace so the
  // highlight reads as one continuous block instead of breaking at
  // every space difference.
  function highlightScreenTail(tailText, matches) {
    const frag = document.createDocumentFragment();
    if (!tailText) return frag;
    let ranges = [];
    for (const mp of matches) {
      if (!mp || mp.verdict !== "OK" || !mp.screen) continue;
      const idx = tailText.indexOf(mp.screen);
      if (idx >= 0) {
        ranges.push({ start: idx, end: idx + mp.screen.length });
        continue;
      }
      const sub = findAllCommonRanges(tailText, mp.screen, MATCH_HL_MIN);
      for (const r of sub) ranges.push(r);
    }
    if (!ranges.length) {
      frag.appendChild(document.createTextNode(tailText));
      return frag;
    }
    ranges.sort((a, b) => a.start - b.start);
    // First merge: overlap or adjacency.
    const merged = [ranges[0]];
    for (let i = 1; i < ranges.length; i++) {
      const last = merged[merged.length - 1];
      if (ranges[i].start <= last.end) {
        last.end = Math.max(last.end, ranges[i].end);
      } else {
        merged.push({ ...ranges[i] });
      }
    }
    // Second merge: gap is purely whitespace → fold the gap into the
    // highlighted block so spaces don't visually disappear from the match.
    const finalRanges = [merged[0]];
    for (let i = 1; i < merged.length; i++) {
      const last = finalRanges[finalRanges.length - 1];
      const gap = tailText.slice(last.end, merged[i].start);
      if (gap.length > 0 && /^\s+$/.test(gap)) {
        last.end = merged[i].end;
      } else {
        finalRanges.push({ ...merged[i] });
      }
    }
    let pos = 0;
    for (const r of finalRanges) {
      if (r.start > pos) frag.appendChild(document.createTextNode(tailText.slice(pos, r.start)));
      const span = document.createElement("span");
      span.className = "match-hl";
      span.textContent = tailText.slice(r.start, r.end);
      frag.appendChild(span);
      pos = r.end;
    }
    if (pos < tailText.length) frag.appendChild(document.createTextNode(tailText.slice(pos)));
    return frag;
  }

  function openCandidateDialog(sid, label, data) {
    const conflict = data.conflict || null;

      header += "LLM disagrees with top score — picked ★ instead. Verify.";

      header += "Verify the screen content matches before confirming.";

    });

      }

      const sf = document.createElement("div"); sf.className = "score-fill"; sf.style.width = (c.score * 100) + "%";
      sb.appendChild(sf);

      el.appendChild(r1);
      const info = document.createElement("div"); info.className = "info";
