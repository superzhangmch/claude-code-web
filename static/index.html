        el.classList.add("conflict");
        const warn = document.createElement("div");
        warn.className = "candidate-conflict";
        warn.textContent = `⚠ already bound to session [${c.bound_to_other.slice(0, 8)}] — picking this steals it`;
        el.appendChild(warn);
      }
      // Evidence pairs from the LLM, shown only on the LLM-picked candidate.
      if (isLLMPick && Array.isArray(data.llm_matches) && data.llm_matches.length) {
        const ev = document.createElement("div"); ev.className = "evidence";
        const head = document.createElement("div"); head.className = "pair";
        const headLbl = document.createElement("div"); headLbl.className = "label";
        headLbl.textContent = "LLM ★";
        const headText = document.createElement("div"); headText.className = "text";
        headText.textContent = data.llm_verified
          ? "evidence (all verified)"
          : "evidence (some unverified — be careful)";
        head.appendChild(headLbl); head.appendChild(headText);
        ev.appendChild(head);
        for (const mp of data.llm_matches) {
          const verdictCls = mp.verdict === "OK" ? "ok" : "fake";
          const tRow = document.createElement("div"); tRow.className = "pair transcript";
          const tLbl = document.createElement("div"); tLbl.className = "label"; tLbl.textContent = "session";
          const tText = document.createElement("div"); tText.className = "text";
          tText.textContent = mp.transcript || "";
          tRow.appendChild(tLbl); tRow.appendChild(tText); ev.appendChild(tRow);
          const sRow = document.createElement("div"); sRow.className = "pair screen";
          const sLbl = document.createElement("div"); sLbl.className = "label";
          // Verdict mark sits at the start of the screen-row label so each
          // pair shows "✓ screen" / "✗ screen" at a glance.
          const vMark = document.createElement("span");
          vMark.className = "vmark " + verdictCls;
          vMark.textContent = mp.verdict === "OK" ? "✓" : "✗";
          sLbl.appendChild(vMark);
          sLbl.appendChild(document.createTextNode("screen"));
          const sText = document.createElement("div"); sText.className = "text";
          sText.textContent = mp.screen || "";
          sRow.appendChild(sLbl); sRow.appendChild(sText); ev.appendChild(sRow);
        }
        el.appendChild(ev);
      }
      const tail = document.createElement("div"); tail.className = "screen-tail";
      const tailText = (c.screen_tail || "").replace(/[\x00\u00a0]/g, " ");
      if (isLLMPick && Array.isArray(data.llm_matches) && data.llm_matches.length) {
        // Highlight the OK-verified screen snippets where they actually
        // appear in the live screen tail.
        tail.appendChild(highlightScreenTail(tailText, data.llm_matches));
      } else {
        tail.textContent = tailText;
      }
      el.appendChild(tail);
      const cardRow = document.createElement("div"); cardRow.className = "card-confirm-row";
      const cardBtn = document.createElement("button");
      cardBtn.className = "card-confirm" + (isLLMPick ? " primary" : "");
      cardBtn.textContent = isLLMPick ? "★ Confirm this tab" : "Confirm this tab";
      cardBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        candiList.querySelectorAll(".candidate.selected").forEach(x => x.classList.remove("selected"));
        el.classList.add("selected");
        candiState.picked = c.iterm_session_id;
        candiOk.disabled = false;
        candiOk.click();
      });
      cardRow.appendChild(cardBtn);
      el.appendChild(cardRow);
      el.addEventListener("click", () => {
        candiList.querySelectorAll(".candidate.selected").forEach(x => x.classList.remove("selected"));
        el.classList.add("selected");
        candiState.picked = c.iterm_session_id;
        candiOk.disabled = false;
      });
      candiList.appendChild(el);
      if (isLLMPick) pickedEl = el;
    }
    if (pickedEl) {
      pickedEl.classList.add("selected");
      candiState.picked = llmPick;
      candiOk.disabled = false;
    }
    candiDlg.classList.add("show");
  }

  candiOk.addEventListener("click", async () => {
    if (!candiState.picked) return;
    candiOk.disabled = true; candiOk.textContent = "Binding…";
    // If the user picks the tab that was already in conflict, confirming
    // here is the user's explicit ack — send force=true. For any other tab
    // pick, send force=false so the server can still warn about a separate
    // conflict on a tab the user manually chose.
    const force = !!(candiState.conflict
                     && candiState.conflict.iterm_session_id === candiState.picked);
    let resp = await authedFetch("/api/attach/confirm", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        claude_session_id: candiState.sid,
        iterm_session_id: candiState.picked,
        force,
      }),
    });
    if (!resp.ok) { alert("Confirm failed: " + await resp.text()); candiOk.disabled = false; candiOk.textContent = "Confirm"; return; }
    let data = await resp.json();
    if (data.result === "conflict") {
      // The tab the user manually picked has its own conflict — annotate
      // that candidate inline instead of stacking a popup. Clicking Confirm
      // again will send force=true (since candiState.conflict now matches
      // the picked iterm_session_id).
      candiOk.disabled = false; candiOk.textContent = "Confirm (steal)";
      candiState.conflict = data.conflict;
      const sel = candiList.querySelector(".candidate.selected");
      if (sel) {
        sel.classList.add("conflict");
        if (!sel.querySelector(".candidate-conflict")) {
          const w = document.createElement("div");
          w.className = "candidate-conflict";
          w.textContent = `⚠ already bound to session [${(data.conflict.with_session || "").slice(0,8)}] — Confirm again to steal it`;
          sel.appendChild(w);
        }
      }
      return;
    }
    candiDlg.classList.remove("show");
    enterTranscript(candiState.sid, candiState.label);
  });
  candiCancel.addEventListener("click", () => candiDlg.classList.remove("show"));

  const candiResume = document.getElementById("candidlg-resume");
  candiResume.addEventListener("click", async () => {
    if (!confirm("None of these tabs is the right one — open a NEW iTerm tab and `claude --resume` this session there?")) return;
    const sid = candiState.sid, label = candiState.label;
    candiDlg.classList.remove("show");
    showLoading("Resuming… (opening tab + waiting for claude)");
    const r = await authedFetch("/api/resume", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ claude_session_id: sid }),
    });
    hideLoading();
    if (!r.ok) { alert("Resume failed: " + await r.text()); return; }
    const rd = await r.json();
    if (rd.result === "bound") {
      enterTranscript(sid, label);
    } else {
      setTimeout(() => attachSession(sid, label), 4000);
    }
  });

  // ---------- transcript rendering ----------
  function* blocksFor(entry) {
    if (entry.type === "summary" || entry.isSidechain) return;
    const role = entry.type;
    if (role !== "user" && role !== "assistant") return;
    const msg = entry.message || entry;
    const content = msg.content;
    const idx = entry._idx, round = entry._round, ts = entry.timestamp, sid = entry.sid;

    if (renderMode === "brief") {
      if (entry.isMeta || entry.toolUseResult) return;
      let text = "";
      if (typeof content === "string") text = content;
      else if (Array.isArray(content)) {
        text = content.filter(p => p && p.type === "text" && p.text).map(p => p.text).join("\n\n");
      }
      if (text.trim()) yield { kind: "text", role, text, idx, round, ts, sid, queued: !!entry._queued };
      return;
    }
    // all mode
    if (typeof content === "string") {
      if (content.trim()) yield { kind: "text", role, text: content, idx, round, ts, sid };
      return;
    }
    if (!Array.isArray(content)) return;
    const common = { idx, round, ts, sid };
    for (const p of content) {
      if (!p) continue;
      if (p.type === "text" && p.text && p.text.trim()) yield { kind: "text", role, text: p.text, ...common };
      else if (p.type === "tool_use") yield { kind: "tool_use", id: p.id, name: p.name || "?", input: p.input, ...common };
      else if (p.type === "tool_result") {
        const c = typeof p.content === "string" ? p.content : JSON.stringify(p.content, null, 2);
        yield { kind: "tool_result", tool_use_id: p.tool_use_id, content: c, is_error: !!p.is_error, ...common };
      } else if (p.type === "thinking" && p.thinking) yield { kind: "thinking", text: p.thinking, ...common };
    }
  }

  // Build the .tool-call box (name + args table) for a tool_use block.
  function buildToolCallBox(use) {
    const box = document.createElement("div"); box.className = "tool-call";
    const name = document.createElement("div"); name.className = "tname"; name.textContent = use.name;
    box.appendChild(name);
    if (use.input && typeof use.input === "object" && !Array.isArray(use.input)) {
      // 2-col key/value table; values with newlines render in <pre>.
      // Wrapper is height-capped + scrollable.
      const wrap = document.createElement("div"); wrap.className = "targs-table-wrap";
      const tbl = document.createElement("table"); tbl.className = "targs-table";
      for (const [k, v] of Object.entries(use.input)) {
        const row = document.createElement("tr");
        const tk = document.createElement("td"); tk.className = "targs-k"; tk.textContent = k;
        const tv = document.createElement("td"); tv.className = "targs-v";
        let display;
        if (typeof v === "string") display = v;
        else { try { display = JSON.stringify(v, null, 2); } catch { display = String(v); } }
        if (typeof display === "string" && display.indexOf("\n") >= 0) {
          const pre = document.createElement("pre");
          pre.textContent = display;
          tv.appendChild(pre);
        } else {
          tv.textContent = display;
        }
        row.appendChild(tk); row.appendChild(tv);
        tbl.appendChild(row);
      }
      wrap.appendChild(tbl); box.appendChild(wrap);
    } else if (use.input !== undefined && use.input !== null) {
      const args = document.createElement("div"); args.className = "targs";
      args.textContent = JSON.stringify(use.input, null, 2);
      box.appendChild(args);
    }
    return box;
  }

  // Build the .tool-result-box for a tool_result block.
  function buildToolResultBox(res) {
    const box = document.createElement("div");
    box.className = "tool-result-box" + (res.is_error ? " is-error" : "");
    box.textContent = res.content;
    return box;
  }

  // Raw text used by the per-block copy button.
  function rawTextFor(b) {
    if (b.kind === "text" || b.kind === "thinking") return b.text || "";
    if (b.kind === "tool_use") {
      const args = (b.input && typeof b.input === "object")
        ? JSON.stringify(b.input, null, 2) : (b.input != null ? String(b.input) : "");
      return (b.name || "") + (args ? "\n" + args : "");
    }
    if (b.kind === "tool_result") return b.content || "";
    return "";
  }

  // Two offset rounded squares — the classic "copy" / "duplicate" icon.
  const COPY_SVG = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.6"/><path d="M11 5.5V3.6A1.6 1.6 0 0 0 9.4 2H3.6A1.6 1.6 0 0 0 2 3.6v5.8A1.6 1.6 0 0 0 3.6 11H5.5"/></svg>';
  const DONE_SVG = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.5,8.5 7,12 13,4.5"/></svg>';

  // `getRaw` is a function so callers can produce the text lazily — useful
  // when the source object isn't fully materialized at construction time.
  function makeCopyBtn(getRaw) {
    const btn = document.createElement("button");
    btn.className = "copy-btn"; btn.title = "Copy raw text";
    btn.innerHTML = COPY_SVG;
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const raw = (typeof getRaw === "function") ? getRaw() : (getRaw || "");
      const done = () => {
        btn.innerHTML = DONE_SVG; btn.classList.add("done");
        setTimeout(() => { btn.innerHTML = COPY_SVG; btn.classList.remove("done"); }, 1000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(raw).then(done, () => btn.title = "Copy failed");
      } else {
        const ta = document.createElement("textarea");
        ta.value = raw; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); done(); }
        catch { btn.title = "Copy failed"; }
        ta.remove();
      }
    });
    return btn;
  }

  // Toggle line-wrap on a target box. Adds/removes `.wrap-on` so CSS can
  // flip white-space pre ↔ pre-wrap. Self-styled to match the row icons.
  function makeWrapBtn(target) {
    const btn = document.createElement("button");
    btn.className = "wrap-btn"; btn.title = "Toggle line wrap";
    btn.textContent = "↵";
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const on = target.classList.toggle("wrap-on");
      btn.classList.toggle("active", on);
    });
    return btn;
  }

  function renderBlock(b) {
    const div = document.createElement("div");
    const role = document.createElement("div");
    role.className = "role";
    const label = document.createElement("span");
    const idx = document.createElement("span");
    idx.className = "idx";
    let when = "";
    if (b.ts) {
      try { const d = new Date(b.ts); const pad = n => String(n).padStart(2, "0");
        when = ` · ${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      } catch {}
    }
    const r = (b.round != null) ? ("r" + b.round + " · ") : "";
    const sidTag = b.sid ? ` · ${String(b.sid).slice(0, 4)}` : "";
    const queuedTag = b.queued ? " · queued" : "";
    idx.textContent = r + "#" + (b.idx ?? "?") + sidTag + queuedTag + when;
    role.appendChild(label); role.appendChild(idx);
    // Per-kind buttons (wrap toggle, copy) get appended below — the wrap
    // button needs the content box to point at, so we build the box first
    // and add buttons afterwards.

    if (b.kind === "text") {
      div.className = "msg " + b.role;
      label.textContent = b.role === "user" ? "You" : "Claude";
      const md = document.createElement("div"); md.className = "markdown";
      md.innerHTML = renderMarkdown(b.text);
      role.appendChild(makeCopyBtn(() => rawTextFor(b)));
      div.appendChild(role); div.appendChild(md);
      _lastBottomToolUse = null;
    } else if (b.kind === "tool_use") {
      div.className = "msg tool"; label.textContent = "Tool call";
      const callBox = buildToolCallBox(b);
      // Wrap toggle on the call box (also flips an inline result if
      // one gets merged in later — CSS rule cascades into .tool-result-box).
      role.appendChild(makeWrapBtn(callBox));
      role.appendChild(makeCopyBtn(() => rawTextFor(b)));
      div.appendChild(role); div.appendChild(callBox);
      // Track this tool_use as the bottom-most rendered block, so a
      // tool_result that arrives next (same batch or a later poll batch)
      // can merge into the same card instead of starting a new one.
      _lastBottomToolUse = b.id ? { id: b.id, box: callBox } : null;
    } else if (b.kind === "tool_result") {
      // Merge into the previous tool_use's card iff it's the most-recent
      // bottom block AND the ids match. Anything else (different id, an
      // unrelated text block in between) → render as a separate card.
      if (_lastBottomToolUse && _lastBottomToolUse.id
          && _lastBottomToolUse.id === b.tool_use_id) {
        const wrap = document.createElement("div");
        wrap.className = "tool-result-inline" + (b.is_error ? " is-error" : "");
        const labRow = document.createElement("div"); labRow.className = "rlabel-row";
        const lab = document.createElement("span"); lab.className = "rlabel";
        lab.textContent = b.is_error ? "result (error)" : "result";
        labRow.appendChild(lab);
        const resBox = buildToolResultBox(b);
        // Dedicated wrap + copy buttons for the merged result. The card's
        // top wrap toggles only the args; this one toggles only the result.
        labRow.appendChild(makeWrapBtn(resBox));
        labRow.appendChild(makeCopyBtn(() => b.content || ""));
        wrap.appendChild(labRow);
        wrap.appendChild(resBox);
        _lastBottomToolUse.box.appendChild(wrap);
        _lastBottomToolUse = null;
        return null;  // already merged; renderEntriesInto skips a null
      }
      div.className = "msg tool"; label.textContent = "Tool result" + (b.is_error ? " (error)" : "");
      const resBox = buildToolResultBox(b);
      role.appendChild(makeWrapBtn(resBox));
      role.appendChild(makeCopyBtn(() => rawTextFor(b)));
      div.appendChild(role); div.appendChild(resBox);
      _lastBottomToolUse = null;
    } else if (b.kind === "thinking") {
      div.className = "msg thinking"; label.textContent = "Thinking";
      const md = document.createElement("div"); md.className = "markdown";
      md.innerHTML = renderMarkdown(b.text);
      role.appendChild(makeCopyBtn(() => rawTextFor(b)));
      div.appendChild(role); div.appendChild(md);
      _lastBottomToolUse = null;
    } else return null;

    // mismatch warning trigger
    if (b.sid && attachedShort && String(b.sid).slice(0, 4) !== attachedShort) {
      flagMismatch(b.sid);
    }
    return div;
  }

  function renderEntriesInto(container, entries, atTop) {
    // For prepend (atTop=true): the historical batch is rendered at the
    // top of the transcript, so it must NOT update the "bottom block"
    // tracker — save the current state and restore after rendering.
    let saved = null;
    if (atTop) saved = _lastBottomToolUse;
    for (const e of entries) {
      for (const b of blocksFor(e)) {
        const el = renderBlock(b);
        if (el) container.appendChild(el);
      }
    }
    if (atTop) _lastBottomToolUse = saved;
  }

  function rebuild() {
    transcriptEl.innerHTML = "";
    _lastBottomToolUse = null;
    renderEntriesInto(transcriptEl, entryCache);
    updateLoadEarlier();
    scrollToBottom();
  }

  function updateLoadEarlier() {
    loadEarlierEl.classList.toggle("show", hasMoreHistory && !!attachedSid);
  }

  function ingest(entries, position) {
    if (!entries?.length) {
      if (position === "replace") { entryCache = []; rebuild(); }
      return;
    }
    if (position === "replace") {
      entryCache = entries.slice();
      earliestIdxLoaded = entries[0]?._idx ?? null;
      rebuild();
    } else if (position === "prepend") {
      const have = new Set(entryCache.map(e => e._idx));
      const fresh = entries.filter(e => !have.has(e._idx));
      if (!fresh.length) return;
      entryCache = fresh.concat(entryCache);
      earliestIdxLoaded = fresh[0]?._idx ?? earliestIdxLoaded;
      const frag = document.createDocumentFragment();
      renderEntriesInto(frag, fresh, /*atTop=*/true);
      const prevH = mainEl.scrollHeight, prevS = mainEl.scrollTop;
      transcriptEl.insertBefore(frag, transcriptEl.firstChild);
      mainEl.scrollTop = prevS + (mainEl.scrollHeight - prevH);
    } else {
      const lastSeen = entryCache.length ? entryCache[entryCache.length - 1]._idx : -Infinity;
      const fresh = entries.filter(e => (e._idx ?? -1) > lastSeen);
      if (!fresh.length) return;
      entryCache = entryCache.concat(fresh);
      const frag = document.createDocumentFragment();
      renderEntriesInto(frag, fresh);
      transcriptEl.appendChild(frag);
      scrollToBottom();
    }
    updateLoadEarlier();
  }

  loadEarlierBtn.addEventListener("click", async () => {
    if (!attachedSid || earliestIdxLoaded === null) return;
    loadEarlierBtn.disabled = true; loadEarlierBtn.textContent = "Loading…";
    try {
      const params = new URLSearchParams();
      params.set("claude_session_id", attachedSid);
      params.set("mode", renderMode);
      params.set("rounds", "5");
      params.set("before_idx", String(earliestIdxLoaded));
      const resp = await authedFetch("/api/state?" + params.toString());
      if (resp.ok) {
        const m = await resp.json();
        ingest(m.transcript || [], "prepend");
        hasMoreHistory = !!m.has_more_history;
      }
    } finally {
      loadEarlierBtn.disabled = false; loadEarlierBtn.textContent = "Load earlier rounds";
    }
  });

  // ---------- mismatch warning ----------
  function flagMismatch(receivedSid) {
    warnEl.classList.add("show");
    warnEl.textContent = "⚠ session mismatch — receiving entries with sid " + String(receivedSid).slice(0,8) + " but attached to " + attachedShort + "…  · tap to re-verify";
  }
  warnEl.addEventListener("click", async () => {
    if (!attachedSid) return;
    await authedFetch("/api/reverify", {
      method: "POST", headers: {"content-type":"application/json"},
      body: JSON.stringify({ claude_session_id: attachedSid }),
    });
    warnEl.classList.remove("show");
    // re-attach
    await attachSession(attachedSid, metaEl.textContent);
  });

  // ---------- mode picker (3 inline buttons) ----------
  for (const b of modePicks) {
    b.addEventListener("click", () => {
      const m = b.dataset.mode;
      if (m === renderMode) return;
      renderMode = m;
      localStorage.setItem("cc_mode", renderMode);
      refreshModeButtons();
      lastIdx = null; entryCache = []; earliestIdxLoaded = null; hasMoreHistory = false;
      rebuild();
      pollOnce();
    });
  }

  // ---------- back / detach ----------
  backBtn.addEventListener("click", () => {
    attachedSid = null; attachedShort = "";
    warnEl.classList.remove("show");
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    showPicker();
  });

  // ---------- autoload indicator ----------
  // States and tap behavior:
  //   polling      → "auto-refreshing · tap to stop"
  //                  tap → manual pause
  //   manual pause → "paused · tap to continue"           (red)
  //                  tap → resume normal auto-refresh for a full
  //                  ACTIVITY_TIMEOUT_MS window, as if newly submitted
  //   timeout pause → "paused · tap to continue"          (red)
  //                  tap → one-shot fetch; stay paused if nothing new
  //   claudeIdle   → "claude idle · tap to refresh"       (red)
  //                  tap → one-shot fetch; stay idle if nothing new
  autoloadEl.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!isPaused && !claudeIdle) {
      setPaused(true, "manual");
      return;
    }
    // Manual-pause tap: full resume, no one-shot. The user explicitly
    // paused while polling was active and now wants it back.
    if (isPaused && pauseReason === "manual") {
      setPaused(false);
      return;
    }
    // Timeout-pause OR claude-idle: one-shot fetch.
    const wasTimeoutPause = isPaused && pauseReason === "timeout";
    const before = lastIdx;
    isPaused = false;     // temp unpause so pollOnce() actually fetches
    keepAlive();
    // Brief "checking…" state — feedback that the tap registered.
    autoloadEl.classList.remove("paused");
    autoloadEl.classList.add("checking");
    autoloadLabel.textContent = "checking…";
    try {
      await pollOnce();
    } finally {
      autoloadEl.classList.remove("checking");
    }
    if (lastIdx !== before) {
      // New content. If claude is generating, polling auto-resumes via
      // pollOnce's finally block. Nothing to do.
      return;
    }
    // Nothing new — restore the prior red state.
    if (wasTimeoutPause) setPaused(true, "timeout");
    else updateAutoload();  // claudeIdle stays true; polling is naturally stopped
  });
  function updateAutoload() {
    autoloadEl.classList.toggle("show", !!attachedSid);
    autoloadEl.classList.toggle("paused", isPaused || claudeIdle);
    autoloadLabel.textContent = isPaused ? "paused · tap to continue"
      : (claudeIdle ? "claude idle · tap to refresh"
      : "auto-refreshing · tap to stop");
  }
  function setPaused(p, reason) {
    isPaused = p;
    pauseReason = p ? (reason || pauseReason || "manual") : null;
    if (!p) { activityDeadline = Date.now() + ACTIVITY_TIMEOUT_MS; if (!pollTimer) schedulePoll(0); }
    else { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }
    updateAutoload();
  }
  function keepAlive() { activityDeadline = Date.now() + ACTIVITY_TIMEOUT_MS; }
  function schedulePoll(delay) {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(pollOnce, delay);
  }

  // ---------- polling ----------
  async function pollOnce() {
    pollTimer = null;
    if (!attachedSid) return;
    if (isPaused) return;
    if (document.hidden) { schedulePoll(POLL_INTERVAL_MS); return; }
    if (Date.now() > activityDeadline) { setPaused(true, "timeout"); return; }
    if (polling) { schedulePoll(POLL_INTERVAL_MS); return; }
    polling = true;
    try {
      const params = new URLSearchParams();
      params.set("claude_session_id", attachedSid);
      params.set("mode", renderMode);
      params.set("rounds", "5");
      if (lastIdx !== null) params.set("since_idx", String(lastIdx));
      const resp = await authedFetch("/api/state?" + params.toString());
      if (resp.status === 410) {
        // pid gone
        warnEl.classList.add("show");
        warnEl.textContent = "⚠ tab/pid is gone. tap back ←  to pick a different session.";
        setStatus("err");
        return;
      }
      if (resp.status === 409) {
        // not bound (server restart?). re-attach.
        await attachSession(attachedSid, metaEl.textContent);
        return;
      }
      if (!resp.ok) { setStatus("err"); return; }
      const m = await resp.json();
      claudeIdle = m.claude_idle === true;
      setStatus("ok"); setReady(m.claude_idle); updateAutoload();
      const entries = m.transcript || [];
      if (lastIdx === null) {
        hasMoreHistory = !!m.has_more_history;
        ingest(entries, "replace");
      } else if (entries.length) {
        if (m.gap_before_idx && entryCache.length) {
          const cl = entryCache[entryCache.length - 1]._idx;
          if (m.gap_before_idx > cl + 1) {
            const marker = document.createElement("div");
            marker.className = "gap";
            marker.textContent = "↑ Missing rounds (gap detected)";
            transcriptEl.appendChild(marker);
          }
        }
        ingest(entries, "append");
      }
      if (typeof m.since_idx === "number") lastIdx = m.since_idx;
      updatePromptRow(m.pending_confirm);
    } catch (e) {
      setStatus("err");
    } finally {
      polling = false;
      if (isPaused) {}
      else if (Date.now() > activityDeadline) setPaused(true, "timeout");
      else if (attachedSid && !claudeIdle) schedulePoll(POLL_INTERVAL_MS);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !isPaused && attachedSid) { keepAlive(); pollOnce(); }
  });
  ["click","keydown","touchstart","input"].forEach(evt => {
    document.addEventListener(evt, keepAlive, { passive: true });
  });

  // ---------- send ----------
  async function send() {
    const text = inputEl.value;
    if (!attachedSid) return;
    // Splice pending image attachments as `@<path>` tokens at the start of
    // the body. claude-code's TUI parses `@<path>` as a file attachment;
    // for image files this becomes inline image input.
    const attachPrefix = pendingUploads.map(u => "@" + u.path).join(" ");
    const body = attachPrefix
      ? (text.trim() ? attachPrefix + " " + text : attachPrefix)
      : text;
    if (!body.trim()) return;
    sendBtn.disabled = true;
    try {
      const resp = await authedFetch("/api/input", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ claude_session_id: attachedSid, text: body }),
      });
      if (resp.ok) {
        inputEl.value = ""; inputEl.style.height = "auto";
        pendingUploads = []; renderUploadRow();
        keepAlive(); schedulePoll(400);
      } else if (resp.status === 410) {
        alert("tab/pid is gone");
      } else {
        alert("Send failed: " + (await resp.text()));
      }
    } finally {
      sendBtn.disabled = false;
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) inputEl.blur(); else inputEl.focus();
    }
  }
  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, window.innerHeight * 0.3) + "px";
  });

  // ---------- image upload ----------
  const uploadInput = document.getElementById("upload-input");
  const uploadBtn = document.getElementById("upload-btn");
  const uploadRow = document.getElementById("upload-row");
  // Pending: {name, path, dataUrl} not yet sent. We splice their `@<path>`
  // tokens into the message body when the user hits Send, then clear.
  let pendingUploads = [];

  function renderUploadRow() {
    uploadRow.innerHTML = "";
    if (!pendingUploads.length) {
      uploadRow.style.display = "none";
      return;
    }
    uploadRow.style.display = "flex";
    pendingUploads.forEach((up, i) => {
      const pill = document.createElement("span"); pill.className = "pill";
      if (up.dataUrl) {
        const img = document.createElement("img"); img.src = up.dataUrl;
        pill.appendChild(img);
      }
      const nm = document.createElement("span");
      nm.textContent = up.name + " ";
      pill.appendChild(nm);
      const x = document.createElement("span"); x.className = "x"; x.textContent = "✕";
      x.addEventListener("click", () => {
        pendingUploads.splice(i, 1);
        renderUploadRow();
      });
      pill.appendChild(x);
      uploadRow.appendChild(pill);
    });
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(file);
    });
  }

  async function uploadFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type && f.type.startsWith("image/"));
    if (!files.length) return;
    showLoading("Uploading " + files.length + " image" + (files.length > 1 ? "s" : "") + "…");
    const previews = [];
    const payload = { files: [] };
    for (const f of files) {
      const dataUrl = await fileToDataUrl(f);
      const i = dataUrl.indexOf(",");
      const b64 = i >= 0 ? dataUrl.slice(i + 1) : dataUrl;
      payload.files.push({ name: f.name || "image", content_type: f.type, b64 });
      previews.push({ name: f.name || "image", dataUrl });
    }
    let resp;
    try {
      resp = await authedFetch("/api/upload", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    } catch (e) {
      hideLoading();
      alert("Upload failed: " + e);
      return;
    }
    hideLoading();
    if (!resp.ok) {
      alert("Upload failed: " + await resp.text());
      return;
    }
    const data = await resp.json();
    (data.files || []).forEach((srv, idx) => {
      pendingUploads.push({
        name: srv.name || previews[idx].name,
        path: srv.path,
        dataUrl: previews[idx].dataUrl,
      });
    });
    renderUploadRow();
    inputEl.focus();
  }

  uploadBtn.addEventListener("click", () => uploadInput.click());
  uploadInput.addEventListener("change", async (e) => {
    if (e.target.files && e.target.files.length) {
      await uploadFiles(e.target.files);
      uploadInput.value = ""; // allow same file twice
    }
  });

  // Drag-and-drop on the input area
  ["dragover", "dragenter"].forEach(evt =>
    inputEl.addEventListener(evt, (e) => { e.preventDefault(); }));
  inputEl.addEventListener("drop", async (e) => {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      e.preventDefault();
      await uploadFiles(e.dataTransfer.files);
    }
  });

  // Paste (⌘V) image from clipboard
  inputEl.addEventListener("paste", async (e) => {
    if (!e.clipboardData || !e.clipboardData.items) return;
    const files = [];
    for (const it of e.clipboardData.items) {
      if (it.kind === "file") {
        const f = it.getAsFile();
        if (f && f.type && f.type.startsWith("image/")) files.push(f);
      }
    }
    if (files.length) {
      e.preventDefault();
      await uploadFiles(files);
    }
  });
  document.getElementById("jump-bottom").addEventListener("click", () => {
    shouldAutoscroll = true; mainEl.scrollTop = mainEl.scrollHeight;
  });

  // ---------- new session dialog ----------
  const newDlg = document.getElementById("newdlg");
  const newDlgCwds = document.getElementById("newdlg-cwds");
  const newDlgCancel = document.getElementById("newdlg-cancel");
  const newDlgOk = document.getElementById("newdlg-ok");
  let selectedCwd = null;

  refreshBtn.addEventListener("click", () => {
    refreshPicker();
  });

  newBtn.addEventListener("click", async () => {
    selectedCwd = null; newDlgOk.disabled = true; newDlgOk.textContent = "Confirm";
    newDlgCwds.innerHTML = "<div style='color:var(--muted);font-size:12px'>loading…</div>";
    newDlg.classList.add("show");
    const r = await authedFetch("/api/cwds");
    if (!r.ok) { newDlgCwds.innerHTML = "<div style='color:#ff6a6a;font-size:12px'>failed to load</div>"; return; }
    const cwds = (await r.json()).cwds || [];
    if (!cwds.length) {
      newDlgCwds.innerHTML = "<div style='color:var(--muted);font-size:12px'>~/.claude/cc_web_cwds is empty or missing</div>";
      return;
    }
    newDlgCwds.innerHTML = "";
    for (const c of cwds) {
      const b = document.createElement("button");
      b.textContent = c;
      b.addEventListener("click", () => {
        newDlgCwds.querySelectorAll("button.selected").forEach(x => x.classList.remove("selected"));
        b.classList.add("selected"); selectedCwd = c; newDlgOk.disabled = false;
      });
      newDlgCwds.appendChild(b);
    }
  });
  newDlgCancel.addEventListener("click", () => newDlg.classList.remove("show"));
  newDlgOk.addEventListener("click", async () => {
    if (!selectedCwd) return;
    newDlg.classList.remove("show");
    showLoading("Opening new claude tab…");
    const r = await authedFetch("/api/new-session", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ cwd: selectedCwd }),
    });
    hideLoading();
    if (!r.ok) { alert("Failed: " + (await r.text())); return; }
    const d = await r.json();
    if (d.result === "bound" && d.binding) {
      enterTranscript(d.binding.claude_session_id, d.label || selectedCwd);
    } else {
      // Server didn't catch the new claude in time — refresh picker as fallback.
      setTimeout(refreshPicker, 1500);
    }
  });

  // ---------- start ----------
  async function start() {
    if (!authToken) { showLogin(false); return; }
    if (!await tryLogin(authToken)) {
      authToken = ""; localStorage.removeItem(TOKEN_KEY); showLogin(false); return;
    }
    showPicker();
  }
  start();
})();
</script>
</body>
</html>
